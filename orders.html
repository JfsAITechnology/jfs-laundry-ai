<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesanan — JFS Laundry AI</title><script src="supabase-config.js?v=20260916-3"></script><style>:root{color-scheme:light}body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#1e293b}.top{background:#0f172a;color:#fff;padding:14px}.wrap{max-width:1200px;margin:auto;padding:20px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,button,select,input{font:inherit;border-radius:8px;padding:9px 11px}.nav a,button{border:0;background:#1e293b;color:#fff;text-decoration:none;cursor:pointer}.table{margin-top:15px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th{background:#0f172a;color:#fff;text-align:left;padding:10px;font-size:12px}td{padding:10px;border-top:1px solid #e2e8f0;font-size:13px}.muted{font-size:11px;color:#64748b}.wa{background:#16a34a!important}.err{display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:12px;border-radius:10px;margin-top:12px}.theme{background:#334155!important}.dark{color-scheme:dark}.dark body{background:#020617;color:#f8fafc}.dark .table{background:#0f172a;border-color:#334155}.dark td{border-color:#334155;color:#f8fafc}.dark .muted{color:#cbd5e1}.dark input,.dark select{background:#020617;color:#fff;border:1px solid #475569}.dark input::placeholder{color:#cbd5e1}.dark .err{background:#450a0a;color:#fecaca;border-color:#7f1d1d}.dark .theme{background:#475569!important;color:#fff!important}.nav .active{background:#2563eb!important}@media(max-width:700px){.bar{flex-direction:column;align-items:flex-start}}</style></head><body><header class="top"><div class="wrap bar"><div><b>📦 Pesanan</b><div id="tenantLabel" class="muted" style="color:#38bdf8">Memuat...</div></div><nav class="nav"><a id="navAdmin" href="#">🏠 Dashboard</a><a id="navOrders" class="active" href="#">📦 Pesanan</a><a id="navHistory" href="#">📋 Riwayat</a><a id="navOmzet" href="#">💰 Omzet</a><a id="navSubscription" href="#">🚀 Subscription</a><a id="navCustomer" href="#">🧺 Customer</a><button id="themeToggle" class="theme" type="button">🌙 Mode Gelap</button></nav></div></header><main class="wrap"><input id="search" placeholder="Cari customer, HP, nomor order..."><button id="refresh">↻ Refresh</button><div id="error" class="err"></div><section class="table"><table><thead><tr><th>Order</th><th>Customer</th><th>Layanan</th><th>Total</th><th>Pembayaran</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></section></main><script type="module">import{supabase,requireTenantRole,redirectToLogin}from'./auth.js';const root=document.documentElement,themeKey='jfs_admin_theme';function setTheme(t){root.classList.toggle('dark',t==='dark');localStorage.setItem(themeKey,t);document.getElementById('themeToggle').textContent=t==='dark'?'☀️ Mode Terang':'🌙 Mode Gelap'}setTheme(localStorage.getItem(themeKey)||'light');document.getElementById('themeToggle').onclick=()=>setTheme(root.classList.contains('dark')?'light':'dark');const code=new URLSearchParams(location.search).get('id')||'JFS-LAUNDRY-DEMO-001',demo=new Set(['JFS-LAUNDRY-DEMO-001','JFS-DEMO-LAUNDRY','demo-asosiasi']);let tenant,orders=[];const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}),meta=o=>{try{return JSON.parse(o.notes||'{}')}catch{return{}}};async function guard(){if(demo.has(code))return true;const r=await requireTenantRole(code,['owner','admin'],{allowDemo:false});if(r.mode==='login'){redirectToLogin(location.href);return false}if(r.mode==='forbidden'){show('Akses ditolak.');return false}return true}function show(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}async function resolve(){if(demo.has(code)){const r=await supabase.rpc('jfs_get_tenant_context_by_code',{p_tenant_code:'JFS-LAUNDRY-DEMO-001'});if(r.error)throw r.error;if(!r.data?.length)throw Error('Demo tenant tidak ditemukan.');tenant=r.data[0];document.getElementById('tenantLabel').textContent=tenant.business_name||'JFS Laundry AI Demo';document.getElementById('navAdmin').style.display='none';document.getElementById('navHistory').style.display='none';document.getElementById('navOmzet').style.display='none';document.getElementById('navSubscription').style.display='none';document.getElementById('navCustomer').href=`index.html?id=${encodeURIComponent(tenant.tenant_code)}`;return}const r=await supabase.rpc('jfs_get_tenant_context_by_code',{p_tenant_code:code});if(r.error)throw r.error;if(!r.data?.length)throw Error('Usaha tidak ditemukan atau akun belum memiliki akses.');tenant=r.data[0];document.getElementById('tenantLabel').textContent=tenant.business_name||'JFS Laundry AI';for(const[id,file]of [['navAdmin','admin.html'],['navHistory','history.html'],['navOmzet','omzet.html'],['navSubscription','subscription.html']])document.getElementById(id).href=`${file}?id=${encodeURIComponent(tenant.tenant_code)}`;document.getElementById('navCustomer').href=`index.html?id=${encodeURIComponent(tenant.tenant_code)}`}async function load(){try{await resolve();const r=await supabase.rpc('jfs_admin_recent_orders',{p_tenant_id:tenant.id});if(r.error)throw r.error;orders=r.data||[];render();document.getElementById('error').style.display='none'}catch(e){show(e.message||'Gagal memuat pesanan.')}}function render(){const q=document.getElementById('search').value.toLowerCase();const rows=orders.filter(o=>{const m=meta(o);return !q||`${o.external_id} ${m.name||''} ${m.phone||''} ${m.service||''}`.toLowerCase().includes(q)});document.getElementById('rows').innerHTML=rows.length?rows.map(o=>{const m=meta(o);return `<tr><td><b>${esc(o.external_id)}</b><div class="muted">${esc(new Date(o.created_at).toLocaleString('id-ID'))}</div></td><td><b>${esc(m.name||'-')}</b><div class="muted">${esc(m.phone||'-')}</div></td><td>${esc(m.service||'-')}<div class="muted">${esc((m.quantity||'-')+' '+(m.unit||''))}</div></td><td>${idr(o.total_amount)}</td><td><select data-pay="${o.id}"><option value="unpaid" ${o.payment_status==='unpaid'?'selected':''}>Belum Dibayar</option><option value="pending" ${o.payment_status==='pending'?'selected':''}>Menunggu</option><option value="paid" ${o.payment_status==='paid'?'selected':''}>Sudah Dibayar</option><option value="failed" ${o.payment_status==='failed'?'selected':''}>Gagal</option><option value="refunded" ${o.payment_status==='refunded'?'selected':''}>Dikembalikan</option></select></td><td><select data-status="${o.id}">${[['pending','Menunggu Jemput'],['processing','Dalam Proses'],['ready','Siap Diambil'],['completed','Selesai'],['cancelled','Dibatalkan']].map(x=>`<option value="${x[0]}" ${o.status===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></td><td><a class="nav a wa" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(m.phone||'')}">WA</a></td></tr>`}).join(''):'<tr><td colspan="7" style="padding:30px;text-align:center;color:#94a3b8">Belum ada pesanan.</td></tr>'}async function update(id,status,pay){const r=await supabase.rpc('jfs_admin_update_order',{p_tenant_id:tenant.id,p_order_id:id,p_status:status||null,p_payment_status:pay||null});if(r.error)alert(r.error.message);else load()}document.getElementById('search').oninput=render;document.getElementById('refresh').onclick=load;document.getElementById('rows').onchange=e=>{if(e.target.dataset.status)update(e.target.dataset.status,e.target.value,null);if(e.target.dataset.pay)update(e.target.dataset.pay,null,e.target.value)};if(await guard())await load();setInterval(load,15000);</script></body></html>
