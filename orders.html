<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Order Management — JFS Laundry AI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260914-6"></script></head><body class="bg-slate-50 text-slate-800 min-h-screen"><header class="bg-slate-900 text-white sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center"><div><h1 class="font-bold">📦 Order Management</h1><p id="tenantLabel" class="text-xs text-sky-400"></p></div><div class="flex gap-2"><a id="navAdmin" class="text-xs bg-slate-800 px-3 py-2 rounded">⚙️ Admin</a><a id="navHistory" class="text-xs bg-purple-600 px-3 py-2 rounded">📋 Riwayat</a><a id="navCustomer" class="text-xs bg-sky-600 px-3 py-2 rounded">🧺 Portal</a></div></div></header><main class="max-w-7xl mx-auto p-4 md:p-6"><section class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5"><div class="bg-white p-4 rounded-xl border"><small>Order Aktif</small><b id="statTotal" class="block text-2xl">0</b></div><div class="bg-white p-4 rounded-xl border"><small>Omzet Aktif</small><b id="statRevenue" class="block text-xl text-emerald-600">Rp 0</b></div><div class="bg-white p-4 rounded-xl border"><small>Customer</small><b id="statCustomers" class="block text-2xl">0</b></div><div class="bg-white p-4 rounded-xl border"><small>Menunggu</small><b id="statPending" class="block text-2xl text-amber-600">0</b></div><div class="bg-white p-4 rounded-xl border"><small>Belum Dibayar</small><b id="statUnpaid" class="block text-2xl text-red-600">0</b></div></section><section id="pageError" class="hidden bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl mb-5 text-sm"></section><section class="bg-white p-4 rounded-xl border mb-5"><div class="flex gap-2"><input id="search" placeholder="Cari nama, HP, nomor order..." class="flex-1 border rounded-lg px-3 py-2 text-sm"><button id="refreshBtn" type="button" class="bg-slate-900 text-white px-4 rounded-lg text-sm">↻ Refresh</button></div></section><section class="bg-white rounded-xl border overflow-hidden"><div class="p-4 border-b"><h2 class="font-bold">Order Customer</h2><p class="text-xs text-slate-500">Semua order berasal dari Supabase. Perubahan status langsung terlihat customer.</p></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-900 text-white text-xs"><tr><th class="p-3 text-left">Order</th><th class="p-3 text-left">Customer</th><th class="p-3">Layanan</th><th class="p-3">Total</th><th class="p-3">Pembayaran</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr></thead><tbody id="rows" class="divide-y"></tbody></table></div></section></main><script type="module">const{data:{session}}=await window.supabase.auth.getSession();const qs=new URLSearchParams(location.search),rawId=qs.get('id')||'JFS-LAUNDRY-DEMO-001',demoIds=new Set(['JFS-LAUNDRY-DEMO-001','JFS-DEMO-LAUNDRY','demo-asosiasi']);let tenant=null,orders=[];const statuses=[['pending','Menunggu Jemput'],['processing','Dalam Proses'],['ready','Siap Diambil'],['completed','Selesai'],['cancelled','Dibatalkan']];const pay={unpaid:'Belum Dibayar',pending:'Menunggu',paid:'Sudah Dibayar',failed:'Gagal',refunded:'Dikembalikan'};const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});function err(m){const e=document.getElementById('pageError');e.textContent=m;e.classList.remove('hidden')}async function guard(){if(demoIds.has(rawId))return true;if(!session){location.href=`login.html?next=${encodeURIComponent(location.href)}`;return false}const{data:membership}=await window.supabase.from('tenant_users').select('role,is_active').eq('user_id',session.user.id).eq('is_active',true).eq('tenant_id',(await window.supabase.from('tenants').select('id').eq('tenant_code',rawId).single()).data?.id).maybeSingle();if(!membership||!['owner','admin'].includes(membership.role)){err('Akses ditolak untuk tenant ini.');return false}return true}async function resolveTenant(){const r=await window.supabase.from('tenants').select('id,tenant_code,business_name').eq('tenant_code',rawId).maybeSingle();if(r.error||!r.data)throw Error('Tenant tidak ditemukan.');tenant=r.data;document.getElementById('tenantLabel').textContent=(tenant.business_name||'JFS Laundry AI')+' • '+tenant.tenant_code;document.getElementById('navAdmin').href=`admin.html?id=${encodeURIComponent(tenant.tenant_code)}`;document.getElementById('navHistory').href=`history.html?id=${encodeURIComponent(tenant.tenant_code)}`;document.getElementById('navCustomer').href=`index.html?id=${encodeURIComponent(tenant.tenant_code)}`}async function loadOrders(){try{await resolveTenant();const{data,error}=await window.supabase.from('jfs_orders').select('id,external_id,status,total_amount,payment_status,payment_method,notes,created_at,updated_at').eq('tenant_id',tenant.id).order('created_at',{ascending:false});if(error)throw error;orders=data||[];render();document.getElementById('pageError').classList.add('hidden')}catch(e){console.error(e);err(e?.message||'Gagal memuat order.');document.getElementById('rows').innerHTML='<tr><td colspan="7" class="p-8 text-center text-red-500">Order gagal dimuat.</td></tr>'}}function meta(o){try{return JSON.parse(o.notes||'{}')}catch{return{}}}function render(){const q=document.getElementById('search').value.toLowerCase();const a=orders.filter(o=>{const m=meta(o);return !q||[o.external_id,m.name,m.phone,m.service].join(' ').toLowerCase().includes(q)});document.getElementById('statTotal').textContent=orders.filter(o=>!['completed','cancelled'].includes(o.status)).length;document.getElementById('statRevenue').textContent=idr(orders.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+Number(o.total_amount||0),0));document.getElementById('statCustomers').textContent=new Set(orders.map(o=>meta(o).phone||meta(o).name).filter(Boolean)).size;document.getElementById('statPending').textContent=orders.filter(o=>o.status==='pending').length;document.getElementById('statUnpaid').textContent=orders.filter(o=>o.payment_status!=='paid'&&o.status!=='cancelled').length;document.getElementById('rows').innerHTML=a.length?a.map(o=>{const m=meta(o),opts=statuses.map(([v,l])=>`<option value="${v}" ${v===o.status?'selected':''}>${l}</option>`).join('');return `<tr><td class="p-3"><b>${esc(o.external_id)}</b><div class="text-[10px] text-slate-500">${new Date(o.created_at).toLocaleString('id-ID')}</div></td><td class="p-3"><b>${esc(m.name||'-')}</b><div class="text-xs text-slate-500">${esc(m.phone||'-')}</div></td><td class="p-3 text-center">${esc(m.service||'-')}<div class="text-xs text-slate-500">${esc((m.quantity||'-')+' '+(m.unit||''))}</div></td><td class="p-3 font-bold">${idr(o.total_amount)}</td><td class="p-3 text-center"><select onchange="setPayment('${o.id}',this.value)" class="border rounded px-2 py-1 text-xs"><option value="unpaid" ${o.payment_status==='unpaid'?'selected':''}>Belum Dibayar</option><option value="pending" ${o.payment_status==='pending'?'selected':''}>Menunggu</option><option value="paid" ${o.payment_status==='paid'?'selected':''}>Sudah Dibayar</option><option value="failed" ${o.payment_status==='failed'?'selected':''}>Gagal</option><option value="refunded" ${o.payment_status==='refunded'?'selected':''}>Dikembalikan</option></select></td><td class="p-3"><select onchange="setStatus('${o.id}',this.value)" class="border rounded px-2 py-1 text-xs">${opts}</select></td><td class="p-3"><button onclick="detail('${o.id}')" class="bg-slate-100 px-2 py-1 rounded text-xs">Detail</button> <a target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(m.phone||'')}" class="bg-emerald-600 text-white px-2 py-1 rounded text-xs">WA</a></td></tr>`}).join(''):'<tr><td colspan="7" class="p-8 text-center text-slate-400">Belum ada order.</td></tr>'}window.setStatus=async(id,status)=>{if(!session&&!demoIds.has(rawId)){err('Login diperlukan untuk mengubah status.');return}const{error}=await window.supabase.from('jfs_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id).eq('tenant_id',tenant.id);if(error)alert(error.message);else loadOrders()};window.setPayment=async(id,payment_status)=>{if(!session&&!demoIds.has(rawId)){err('Login diperlukan untuk mengubah pembayaran.');return}const patch={payment_status,updated_at:new Date().toISOString(),...(payment_status==='paid'?{paid_at:new Date().toISOString()}:{})};const{error}=await window.supabase.from('jfs_orders').update(patch).eq('id',id).eq('tenant_id',tenant.id);if(error)alert(error.message);else loadOrders()};window.detail=id=>{const o=orders.find(x=>x.id===id),m=meta(o);alert(`Order ${o.external_id}\nCustomer: ${m.name||'-'}\nHP: ${m.phone||'-'}\nLayanan: ${m.service||'-'}\nJumlah: ${m.quantity||'-'} ${m.unit||''}\nCara: ${m.delivery==='dropoff'?'Antar Sendiri':'Jemput Cucian'}\nAlamat: ${m.address||'-'}\nPickup: ${m.pickupTime||'-'}\nTotal: ${idr(o.total_amount)}\nPembayaran: ${pay[o.payment_status]||o.payment_status}`)}document.getElementById('search').addEventListener('input',render);document.getElementById('refreshBtn').addEventListener('click',loadOrders);if(await guard())await loadOrders();setInterval(()=>loadOrders(),5000);</script></body></html>
