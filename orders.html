<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order Management — JFS Laundry AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="supabase-config.js"></script><script type="module">import { guardTenantPage } from './auth-guard.js'; guardTenantPage();</script></head><body class="bg-slate-50 text-slate-800 min-h-screen"><header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md"><div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3"><div><h1 class="font-bold text-lg">📦 Order Management</h1><p class="text-xs text-sky-400" id="tenantLabel"></p></div><div class="flex gap-2"><a id="navAdmin" class="text-xs bg-slate-800 px-3 py-2 rounded-lg border border-slate-700">⚙️ Admin</a><a id="navHistory" class="text-xs bg-purple-600 px-3 py-2 rounded-lg">📋 Riwayat Order</a><a id="navCustomer" class="text-xs bg-sky-600 px-3 py-2 rounded-lg">🧺 Portal</a></div></div></header><main class="max-w-7xl mx-auto px-4 py-6"><div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6"><div class="bg-white p-4 rounded-xl border shadow-sm"><p class="text-xs text-slate-500">Order Aktif</p><b id="statTotal" class="text-2xl">0</b></div><div class="bg-white p-4 rounded-xl border shadow-sm"><p class="text-xs text-slate-500">Omzet Aktif</p><b id="statRevenue" class="text-xl text-emerald-600">Rp 0</b></div><div class="bg-white p-4 rounded-xl border shadow-sm"><p class="text-xs text-purple-600">Customer</p><b id="statCustomers" class="text-2xl text-purple-600">0</b></div><div class="bg-white p-4 rounded-xl border shadow-sm"><p class="text-xs text-amber-600">Menunggu</p><b id="statPending" class="text-2xl text-amber-600">0</b></div><div class="bg-white p-4 rounded-xl border shadow-sm"><p class="text-xs text-blue-600">Dalam Proses</p><b id="statProcess" class="text-2xl text-blue-600">0</b></div></div><div class="bg-white p-4 rounded-xl border shadow-sm mb-6 flex flex-col md:flex-row gap-3 justify-between"><input id="searchInput" placeholder="Cari nama atau nomor HP..." class="w-full md:w-80 px-3 py-2 text-sm border rounded-lg"><div class="flex gap-2"><button onclick="refreshOrders()" class="bg-slate-100 px-4 py-2 rounded-lg text-sm">↻ Refresh</button><button onclick="clearDemoData()" class="bg-rose-50 text-rose-600 border border-rose-200 px-4 py-2 rounded-lg text-sm">Reset Demo</button></div></div><div class="bg-white rounded-xl border shadow-sm overflow-hidden"><div class="px-4 py-3 border-b"><h2 class="font-bold">Order Aktif</h2><p class="text-xs text-slate-500">Order yang masih perlu ditangani. Arsipkan untuk memindahkannya ke Riwayat.</p></div><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="bg-slate-900 text-slate-200 text-xs uppercase"><th class="p-3">Waktu</th><th class="p-3">Pelanggan</th><th class="p-3">Layanan / Jumlah</th><th class="p-3">Alamat</th><th class="p-3">Total</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr></thead><tbody id="orderTableBody" class="divide-y"></tbody></table></div><div id="emptyState" class="hidden py-12 text-center text-slate-400">Belum ada order aktif.</div></div></main><script>
const tenantId=new URLSearchParams(location.search).get('id')||'demo-asosiasi',KEY=`jfs_orders_${tenantId}`;document.getElementById('tenantLabel').innerText=`Tenant ID: ${tenantId}`;document.getElementById('navAdmin').href=`admin.html?id=${encodeURIComponent(tenantId)}`;document.getElementById('navHistory').href=`history.html?id=${encodeURIComponent(tenantId)}`;document.getElementById('navCustomer').href=`index.html?id=${encodeURIComponent(tenantId)}`;
const mockOrders=[{id:'ORD-1001',timestamp:'12/09/2026 13:45',name:'Bpk. Ahmad Suherman',phone:'6281234567890',service:'Cuci Komplit Reguler',weight:'5 kg',address:'Jl. Raya Darmo No. 45, Surabaya',total:35000,status:'Menunggu Jemput',active:true},{id:'ORD-1002',timestamp:'12/09/2026 11:20',name:'Ibu Rina Wijaya',phone:'6289876543210',service:'Cuci Express 1 Hari',weight:'3 kg',address:'Komplek Asri B-12, Surabaya',total:30000,status:'Dalam Proses',active:true},{id:'ORD-1003',timestamp:'11/09/2026 16:10',name:'Pak Hendra',phone:'6285711223344',service:'Cuci Bedcover Large',weight:'1 Pcs',address:'Jl. Pemuda No. 8, Surabaya',total:45000,status:'Selesai',active:true}];
const STATUSES=['Menunggu Jemput','Dalam Proses','Siap Diambil','Selesai'];
function readOrders(){try{const d=JSON.parse(localStorage.getItem(KEY)||'');if(Array.isArray(d))return d}catch(e){};localStorage.setItem(KEY,JSON.stringify(mockOrders));return mockOrders}
function writeOrders(orders){localStorage.setItem(KEY,JSON.stringify(orders));window.dispatchEvent(new Event('orders-updated'))}
function idr(n){return Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0})}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function activeOrders(){return readOrders().filter(o=>o.active!==false)}
function renderOrders(q=''){const orders=activeOrders(),needle=q.toLowerCase(),filtered=orders.filter(o=>(o.name||'').toLowerCase().includes(needle)||(o.phone||'').includes(needle)||(o.id||'').toLowerCase().includes(needle));document.getElementById('statTotal').innerText=orders.length;document.getElementById('statRevenue').innerText=idr(orders.reduce((s,o)=>s+Number(o.total||0),0));document.getElementById('statCustomers').innerText=new Set(orders.map(o=>o.phone||o.name)).size;document.getElementById('statPending').innerText=orders.filter(o=>o.status==='Menunggu Jemput').length;document.getElementById('statProcess').innerText=orders.filter(o=>o.status==='Dalam Proses').length;const body=document.getElementById('orderTableBody'),empty=document.getElementById('emptyState');body.innerHTML='';if(!filtered.length){empty.classList.remove('hidden');return}empty.classList.add('hidden');filtered.forEach(o=>{const statusClass=o.status==='Selesai'?'bg-emerald-100 text-emerald-800':o.status==='Siap Diambil'?'bg-purple-100 text-purple-800':o.status==='Dalam Proses'?'bg-blue-100 text-blue-800':'bg-amber-100 text-amber-800';const msg=encodeURIComponent(`Halo ${o.name}, kami dari laundry mengonfirmasi order ${o.id} (${o.service}).`);const options=STATUSES.map(s=>`<option value="${esc(s)}" ${o.status===s?'selected':''}>${esc(s)}</option>`).join('');const tr=document.createElement('tr');tr.className='hover:bg-slate-50';tr.innerHTML=`<td class="p-3 text-xs text-slate-500">${esc(o.timestamp||'-')}</td><td class="p-3"><b>${esc(o.name||'-')}</b><div class="text-xs text-slate-500">${esc(o.phone||'-')}</div></td><td class="p-3"><b>${esc(o.service||'-')}</b><div class="text-xs text-slate-500">${esc(o.weight||'-')}</div></td><td class="p-3 text-xs max-w-xs">${esc(o.address||'-')}</td><td class="p-3 font-bold">${idr(o.total)}</td><td class="p-3"><select onchange="changeStatus('${esc(o.id)}',this.value)" class="text-xs border rounded-lg px-2 py-1 ${statusClass}">${options}</select></td><td class="p-3"><div class="flex flex-wrap gap-1.5"><button onclick="viewDetail('${esc(o.id)}')" class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1.5 rounded">👁️ Detail</button><a target="_blank" href="https://wa.me/${encodeURIComponent(o.phone||'')}?text=${msg}" class="bg-emerald-600 text-white text-xs px-2.5 py-1.5 rounded">WA</a><button onclick="archiveOrder('${esc(o.id)}')" class="bg-rose-50 text-rose-600 border border-rose-200 text-xs px-2.5 py-1.5 rounded">🗑️ Arsipkan</button></div></td>`;body.appendChild(tr)})}
function changeStatus(id,status){const orders=readOrders();const o=orders.find(x=>x.id===id);if(!o)return;o.status=status;o.updated_at=new Date().toISOString();writeOrders(orders);renderOrders(document.getElementById('searchInput').value)}
function archiveOrder(id){const orders=readOrders(),o=orders.find(x=>x.id===id);if(!o)return;if(!confirm(`Arsipkan order ${id}? Data tidak dihapus permanen dan tetap tersedia di Riwayat Order.`))return;o.active=false;o.archived_at=new Date().toISOString();writeOrders(orders);renderOrders(document.getElementById('searchInput').value)}
function viewDetail(id){const o=readOrders().find(x=>x.id===id);if(!o)return;alert(`Order ${o.id}\n\nCustomer: ${o.name||'-'}\nNo. HP: ${o.phone||'-'}\nLayanan: ${o.service||'-'}\nJumlah: ${o.weight||'-'}\nAlamat: ${o.address||'-'}\nStatus: ${o.status||'-'}\nTotal: ${idr(o.total)}`)}
function refreshOrders(){renderOrders(document.getElementById('searchInput').value)}
function clearDemoData(){if(confirm('Reset data demo? Data demo akan dibuat kembali.')){localStorage.removeItem(KEY);renderOrders()}}
document.getElementById('searchInput').addEventListener('input',e=>renderOrders(e.target.value));window.addEventListener('storage',refreshOrders);window.addEventListener('orders-updated',refreshOrders);window.addEventListener('DOMContentLoaded',renderOrders);setInterval(refreshOrders,3000);
</script></body></html>
