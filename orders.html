<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesanan — JFS Laundry AI</title><script src="supabase-config.js?v=20260916-4"></script><style>:root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--line:#e2e8f0;--dark:#0f172a;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.top{background:var(--dark);color:#fff}.wrap{max-width:1200px;margin:auto;padding:16px 20px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button,button,select,input{font:inherit;border-radius:8px}.nav a,.nav button,button{border:0;background:#1e293b;color:#fff;padding:9px 11px;text-decoration:none;cursor:pointer}.nav .active{background:var(--blue)}input,select{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.table{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th{background:var(--dark);color:#fff;text-align:left;padding:10px;font-size:12px}td{padding:10px;border-top:1px solid var(--line);font-size:13px}.muted{font-size:11px;color:var(--muted)}.err{display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:12px;border-radius:10px;margin-top:12px}.detail{background:#0f172a;color:#fff}.wa{background:#16a34a!important}.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.65);align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{max-width:560px;width:100%;background:#fff;color:#0f172a;border-radius:16px;padding:20px}.dialog h2{margin-top:0}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}@media(max-width:700px){.bar{flex-direction:column;align-items:flex-start}}</style></head><body><header class="top"><div class="wrap bar"><div><b>📦 Pesanan</b><div id="tenantLabel" class="muted" style="color:#38bdf8">Memuat...</div></div><nav class="nav"><a id="navAdmin">🏠 Dashboard</a><a id="navOrders" class="active">📦 Pesanan</a><a id="navHistory">📋 Riwayat</a><a id="navOmzet">💰 Omzet</a><a id="navSubscription">🚀 Subscription</a><a id="navCustomer">🧺 Customer</a></nav></div></header><main class="wrap"><div class="toolbar"><input id="search" placeholder="Cari customer, HP, nomor order..."><select id="statusFilter"><option value="">Semua Status</option><option value="pending">Menunggu Jemput</option><option value="processing">Dalam Proses</option><option value="ready">Siap Diambil</option><option value="completed">Selesai</option><option value="cancelled">Dibatalkan</option></select><button id="refresh">↻ Refresh</button></div><div id="error" class="err"></div><section class="table"><table><thead><tr><th>Order</th><th>Customer</th><th>Layanan</th><th>Total</th><th>Pembayaran</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></section></main><div id="modal" class="modal"><div class="dialog"><h2>Detail Pesanan</h2><div id="detailBody"></div><div class="dialog-actions"><button id="closeModal">Tutup</button></div></div></div><script type="module">import{supabase,requireTenantRole,redirectToLogin}from'./auth.js';const code=new URLSearchParams(location.search).get('id')||'JFS-LAUNDRY-DEMO-001',demo=new Set(['JFS-LAUNDRY-DEMO-001','JFS-DEMO-LAUNDRY','demo-asosiasi']);let tenant,orders=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}),meta=o=>{try{return JSON.parse(o.notes||'{}')}catch{return{}}},labels={pending:'Menunggu Jemput',processing:'Dalam Proses',ready:'Siap Diambil',completed:'Selesai',cancelled:'Dibatalkan'};function show(m){$('error').textContent=m;$('error').style.display='block'}async function guard(){if(demo.has(code))return true;const r=await requireTenantRole(code,['owner','admin'],{allowDemo:false});if(r.mode==='login'){redirectToLogin(location.href);return false}if(r.mode==='forbidden'){show('Akses ditolak.');return false}return true}async function resolve(){const r=await supabase.rpc('jfs_get_tenant_context_by_code',{p_tenant_code:code});if(r.error)throw r.error;if(!r.data?.length)throw Error('Usaha tidak ditemukan atau akun belum memiliki akses.');tenant=r.data[0];$('tenantLabel').textContent=tenant.business_name||'JFS Laundry AI';for(const[id,file]of [['navAdmin','admin.html'],['navOrders','orders.html'],['navHistory','history.html'],['navOmzet','omzet.html'],['navSubscription','subscription.html']])$(id).href=`${file}?id=${encodeURIComponent(tenant.tenant_code)}`;$('navCustomer').href=`index.html?id=${encodeURIComponent(tenant.tenant_code)}`}async function load(){try{await resolve();const r=await supabase.rpc('jfs_admin_recent_orders',{p_tenant_id:tenant.id});if(r.error)throw r.error;orders=r.data||[];render();$('error').style.display='none'}catch(e){show(e.message||'Gagal memuat pesanan.')}}function render(){const q=$('search').value.toLowerCase(),sf=$('statusFilter').value;const rows=orders.filter(o=>{const m=meta(o),text=`${o.external_id} ${m.name||''} ${m.phone||''} ${m.service||''}`.toLowerCase();return(!q||text.includes(q))&&(!sf||o.status===sf)});$('rows').innerHTML=rows.length?rows.map(o=>{const m=meta(o);return `<tr><td><b>${esc(o.external_id)}</b><div class="muted">${esc(new Date(o.created_at).toLocaleString('id-ID'))}</div></td><td><b>${esc(m.name||'-')}</b><div class="muted">${esc(m.phone||'-')}</div></td><td>${esc(m.service||'-')}<div class="muted">${esc((m.quantity||'-')+' '+(m.unit||''))}</div></td><td>${idr(o.total_amount)}</td><td><select data-pay="${o.id}"><option value="unpaid" ${o.payment_status==='unpaid'?'selected':''}>Belum Dibayar</option><option value="pending" ${o.payment_status==='pending'?'selected':''}>Menunggu</option><option value="paid" ${o.payment_status==='paid'?'selected':''}>Sudah Dibayar</option><option value="failed" ${o.payment_status==='failed'?'selected':''}>Gagal</option><option value="refunded" ${o.payment_status==='refunded'?'selected':''}>Dikembalikan</option></select></td><td><select data-status="${o.id}">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}</select></td><td><button class="detail" data-detail="${o.id}">Detail</button> <a class="nav a wa" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(m.phone||'')}">WA</a></td></tr>`}).join(''):'<tr><td colspan="7" style="padding:30px;text-align:center;color:#94a3b8">Belum ada pesanan.</td></tr>'}function openDetail(id){const o=orders.find(x=>x.id===id);if(!o)return;const m=meta(o);$('detailBody').innerHTML=`<p><b>Nomor:</b> ${esc(o.external_id)}</p><p><b>Customer:</b> ${esc(m.name||'-')} — ${esc(m.phone||'-')}</p><p><b>Layanan:</b> ${esc(m.service||'-')} ${esc(m.quantity||'')} ${esc(m.unit||'')}</p><p><b>Total:</b> ${idr(o.total_amount)}</p><p><b>Pembayaran:</b> ${esc(o.payment_status||'-')}</p><p><b>Status:</b> ${esc(labels[o.status]||o.status)}</p><p><b>Catatan:</b> ${esc(o.notes||'-')}</p>`;$('modal').classList.add('show')}async function update(id,status,pay){const r=await supabase.rpc('jfs_admin_update_order',{p_tenant_id:tenant.id,p_order_id:id,p_status:status||null,p_payment_status:pay||null});if(r.error)alert(r.error.message);else load()}$('search').oninput=render;$('statusFilter').onchange=render;$('refresh').onclick=load;$('closeModal').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};$('rows').onclick=e=>{const b=e.target.closest('[data-detail]');if(b)openDetail(b.dataset.detail)};$('rows').onchange=e=>{if(e.target.dataset.status)update(e.target.dataset.status,e.target.value,null);if(e.target.dataset.pay)update(e.target.dataset.pay,null,e.target.value)};if(await guard())await load();setInterval(load,15000);</script></body></html>
