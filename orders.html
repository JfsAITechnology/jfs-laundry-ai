<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Management - JFS Laundry AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header / Navbar -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 border-b border-slate-800 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-sky-500 text-slate-950 p-2 rounded-lg font-bold">
          <i class="fa-solid fa-boxes-packing text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Order Management</h1>
          <p class="text-xs text-sky-400" id="tenantLabel">Tenant ID: Loading...</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <a id="navAdmin" href="#" class="text-xs sm:text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-gear"></i> Pengaturan
        </a>
        <a id="navCustomer" href="#" class="text-xs sm:text-sm bg-sky-600 hover:bg-sky-500 text-white px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-store"></i> Portal
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Ringkasan Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500 font-medium mb-1">Total Order</div>
        <div class="text-2xl font-bold text-slate-900" id="statTotal">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-amber-600 font-medium mb-1">Menunggu Penjemputan</div>
        <div class="text-2xl font-bold text-amber-600" id="statPending">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-blue-600 font-medium mb-1">Dalam Proses</div>
        <div class="text-2xl font-bold text-blue-600" id="statProcess">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-emerald-600 font-medium mb-1">Selesai</div>
        <div class="text-2xl font-bold text-emerald-600" id="statCompleted">0</div>
      </div>
    </div>

    <!-- Filter & Aksi -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row gap-3 justify-between items-center">
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="Cari nama atau nomor HP..." class="w-full pl-9 pr-4 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500" />
      </div>
      <div class="flex gap-2 w-full md:w-auto justify-end">
        <button onclick="refreshOrders()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
          <i class="fa-solid fa-rotate"></i> Refresh Data
        </button>
        <button onclick="clearDemoData()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-sm px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
          <i class="fa-solid fa-trash-can"></i> Reset Demo
        </button>
      </div>
    </div>

    <!-- Tabel / Daftar Order -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-900 text-slate-200 text-xs font-semibold uppercase tracking-wider">
              <th class="py-3.5 px-4">Waktu</th>
              <th class="py-3.5 px-4">Pelanggan</th>
              <th class="py-3.5 px-4">Layanan / Berat</th>
              <th class="py-3.5 px-4">Alamat Penjemputan</th>
              <th class="py-3.5 px-4">Estimasi Total</th>
              <th class="py-3.5 px-4">Status</th>
              <th class="py-3.5 px-4 text-center">Aksi WA</th>
            </tr>
          </thead>
          <tbody id="orderTableBody" class="divide-y divide-slate-100">
            <!-- Data dimasukkan via Javascript -->
          </tbody>
        </table>
      </div>
      <div id="emptyState" class="hidden py-12 text-center text-slate-400">
        <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
        <p class="text-sm">Belum ada data pesanan yang masuk.</p>
      </div>
    </div>

  </main>

  <script>
    // 1. Ambil Parameter Tenant ID dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const tenantId = urlParams.get('id') || 'demo-asosiasi';
    const STORAGE_KEY = `jfs_orders_${tenantId}`;

    document.getElementById('tenantLabel').innerText = `Tenant ID: ${tenantId}`;
    document.getElementById('navAdmin').href = `admin.html?id=${tenantId}`;
    document.getElementById('navCustomer').href = `index.html?id=${tenantId}`;

    // 2. Data Dummy Awal jika Storage Kosong (Khusus Demo)
    const mockOrders = [
      {
        id: 'ORD-1001',
        timestamp: '12 Sep 2026, 13:45',
        name: 'Bpk. Ahmad Suherman',
        phone: '6281234567890',
        service: 'Cuci Komplit Reguler',
        weight: '5 kg',
        address: 'Jl. Raya Darmo No. 45, Surabaya',
        total: 35000,
        status: 'Menunggu Jemput'
      },
      {
        id: 'ORD-1002',
        timestamp: '12 Sep 2026, 11:20',
        name: 'Ibu Rina Wijaya',
        phone: '6289876543210',
        service: 'Cuci Express 1 Hari',
        weight: '3 kg',
        address: 'Komplek Asri B-12, Surabaya',
        total: 30000,
        status: 'Dalam Proses'
      },
      {
        id: 'ORD-1003',
        timestamp: '11 Sep 2026, 16:10',
        name: 'Pak Hendra',
        phone: '6285711223344',
        service: 'Cuci Bedcover Large',
        weight: '1 Pcs',
        address: 'Jl. Pemuda No. 8, Surabaya',
        total: 45000,
        status: 'Selesai'
      }
    ];

    // Initialize LocalStorage
    function getStoredOrders() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (!data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(mockOrders));
        return mockOrders;
      }
      return JSON.parse(data);
    }

    // Render Data Ke Tabel
    function renderOrders(filterText = '') {
      const orders = getStoredOrders();
      const tbody = document.getElementById('orderTableBody');
      const emptyState = document.getElementById('emptyState');
      tbody.innerHTML = '';

      const filtered = orders.filter(o => 
        o.name.toLowerCase().includes(filterText.toLowerCase()) || 
        o.phone.includes(filterText)
      );

      // Update Stats
      document.getElementById('statTotal').innerText = orders.length;
      document.getElementById('statPending').innerText = orders.filter(o => o.status === 'Menunggu Jemput').length;
      document.getElementById('statProcess').innerText = orders.filter(o => o.status === 'Dalam Proses').length;
      document.getElementById('statCompleted').innerText = orders.filter(o => o.status === 'Selesai').length;

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      filtered.forEach(order => {
        let statusBadge = '';
        if (order.status === 'Menunggu Jemput') {
          statusBadge = `<span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-medium">Menunggu Jemput</span>`;
        } else if (order.status === 'Dalam Proses') {
          statusBadge = `<span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-medium">Dalam Proses</span>`;
        } else {
          statusBadge = `<span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-medium">Selesai</span>`;
        }

        const formattedPrice = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(order.total);
        const waMessage = encodeURIComponent(`Halo ${order.name}, kami dari pihak Laundry mengonfirmasi pesanan ${order.id} (${order.service}).`);

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition border-b border-slate-100';
        tr.innerHTML = `
          <td class="py-3 px-4 text-xs text-slate-500 font-mono">${order.timestamp}</td>
          <td class="py-3 px-4 font-semibold text-slate-900">
            ${order.name}<br>
            <span class="text-xs font-normal text-slate-500 font-mono">${order.phone}</span>
          </td>
          <td class="py-3 px-4">
            <span class="font-medium text-slate-800">${order.service}</span><br>
            <span class="text-xs text-slate-500">${order.weight}</span>
          </td>
          <td class="py-3 px-4 text-xs text-slate-600 max-w-xs truncate">${order.address}</td>
          <td class="py-3 px-4 font-bold text-slate-900">${formattedPrice}</td>
          <td class="py-3 px-4">${statusBadge}</td>
          <td class="py-3 px-4 text-center">
            <a href="https://wa.me/${order.phone}?text=${waMessage}" target="_blank" class="inline-flex items-center gap-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-md font-medium transition">
              <i class="fa-brands fa-whatsapp"></i> Chat
            </a>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Event Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderOrders(e.target.value);
    });

    function refreshOrders() {
      renderOrders();
    }

    function clearDemoData() {
      if (confirm('Kembalikan data pesanan ke default demo?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderOrders();
      }
    }

    // Run On Load
    renderOrders();
  </script>
</body>
</html>
