<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Masuk — JFS AI</title><link rel="stylesheet" href="login.css?v=20260916-4"></head><body><main class="login-shell"><section class="login-card" aria-label="Form masuk JFS AI"><div class="brand-lockup"><div class="brand-mark"><img src="logo-jfs.png" alt="JFS AI"></div><div><div class="brand-name">JFS AI</div><div class="brand-subtitle">Technology Platform</div></div></div><div class="intro"><span class="eyebrow">BUSINESS DASHBOARD</span><h1>Selamat datang kembali</h1><p>Masuk untuk mengelola usaha, order, layanan, dan subscription Anda.</p></div><form id="form" class="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="nama@email.com" required><div class="password-row"><label for="password">Password</label><a href="forgot-password.html">Lupa password?</a></div><input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required><button id="loginButton" type="submit">Masuk ke Dashboard <span aria-hidden="true">→</span></button></form><div id="msg" class="msg" role="alert" aria-live="polite"></div><div class="signup-box"><span>Belum punya akun usaha?</span><a href="signup.html">Daftar sekarang</a></div><div class="security-note"><span aria-hidden="true">🔒</span><span>Akses aman berbasis akun dan tenant.</span></div></section><p class="footer-note">© 2026 JFS AI Technology</p></main><script src="supabase-config.js"></script><script type="module">import{signIn,isSuperAdmin,supabase}from'./auth.js';const form=document.getElementById('form'),msg=document.getElementById('msg'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password'),loginButton=document.getElementById('loginButton');form.onsubmit=async e=>{e.preventDefault();msg.textContent='';loginButton.disabled=true;loginButton.innerHTML='Memproses…';try{await signIn(emailInput.value.trim(),passwordInput.value);const user=(await supabase.auth.getUser()).data.user;const next=new URLSearchParams(location.search).get('next');if(await isSuperAdmin()){location.href=next||'super-admin.html';return}let{data}=await supabase.from('tenant_users').select('tenant_id,role,is_active').eq('user_id',user.id).eq('is_active',true).in('role',['owner','admin']).limit(1).maybeSingle();if(!data){const meta=user.user_metadata||{};if(!meta.business_name||!meta.whatsapp||!meta.full_name)throw new Error('Akun belum memiliki data onboarding laundry. Silakan daftar ulang dengan data lengkap.');const result=await supabase.rpc('jfs_create_laundry_tenant',{p_business_name:String(meta.business_name),p_whatsapp:String(meta.whatsapp),p_full_name:String(meta.full_name)});if(result.error)throw result.error;data={tenant_id:result.data}}localStorage.setItem('jfs_current_tenant',data.tenant_id);if(next){const target=new URL(next,location.href),page=target.pathname.split('/').pop(),targetId=target.searchParams.get('id');if(['admin.html','orders.html','history.html','omzet.html','subscription.html'].includes(page)&&targetId&&targetId!=='demo-asosiasi'&&targetId!==data.tenant_id)throw new Error('Akses tenant tidak sesuai akun.');if(['admin.html','orders.html','history.html','omzet.html','subscription.html'].includes(page)){target.searchParams.set('id',data.tenant_id);location.href=target.toString();return}}location.href=`admin.html?id=${encodeURIComponent(data.tenant_id)}`}catch(err){msg.textContent=err?.message||'Login gagal.';loginButton.disabled=false;loginButton.innerHTML='Masuk ke Dashboard <span aria-hidden="true">→</span>'}};</script></body></html>
