<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — JFS AI Laundry</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,92vw);background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 30px #0001}h1{margin-top:0}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ccd3dd}button{background:#111827;color:white;border:0;cursor:pointer;font-weight:700}.msg{margin-top:12px;color:#b42318;min-height:20px}.brand{font-weight:800;margin-bottom:20px}@media(prefers-color-scheme:dark){body{background:#020617;color:#f8fafc}.card{background:#0f172a;color:#f8fafc;box-shadow:0 10px 30px #0008}input{background:#020617;color:#fff;border-color:#475569}input::placeholder{color:#cbd5e1}a{color:#60a5fa}.msg{color:#fca5a5}}</style></head><body><div class="card"><div class="brand">JFS AI × Laundry</div><h1>Masuk</h1><p>Gunakan akun JFS AI Anda untuk mengakses dashboard.</p><form id="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Masuk</button></form><div id="msg" class="msg"></div><p style="font-size:13px">Belum punya akun laundry? <a href="signup.html">Daftar pengusaha laundry</a></p></div><script src="supabase-config.js"></script><script type="module">import { signIn, isSuperAdmin, supabase } from './auth.js';const form=document.getElementById('form'),msg=document.getElementById('msg'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Memproses...';try{await signIn(emailInput.value.trim(),passwordInput.value);const user=(await supabase.auth.getUser()).data.user;const next=new URLSearchParams(location.search).get('next');if(await isSuperAdmin()){location.href=next||'super-admin.html';return;}let {data}=await supabase.from('tenant_users').select('tenant_id, role, is_active').eq('user_id',user.id).eq('is_active',true).in('role',['owner','admin']).limit(1).maybeSingle();if(!data){const meta=user.user_metadata||{};if(!meta.business_name||!meta.whatsapp||!meta.full_name)throw new Error('Akun belum memiliki data onboarding laundry. Silakan daftar ulang dengan data lengkap.');const result=await supabase.rpc('jfs_create_laundry_tenant',{p_business_name:String(meta.business_name),p_whatsapp:String(meta.whatsapp),p_full_name:String(meta.full_name)});if(result.error)throw result.error;data={tenant_id:result.data};}localStorage.setItem('jfs_current_tenant',data.tenant_id);if(next){try{const target=new URL(next,location.href);const targetPage=target.pathname.split('/').pop();const targetId=target.searchParams.get('id');if(['admin.html','orders.html'].includes(targetPage)&&targetId&&targetId!=='demo-asosiasi'&&targetId!==data.tenant_id)throw new Error('Akses tenant tidak sesuai akun.');if(['admin.html','orders.html'].includes(targetPage)){target.searchParams.set('id',data.tenant_id);location.href=target.toString();return;}}catch(err){if(err.message==='Akses tenant tidak sesuai akun.')throw err;}}location.href=`admin.html?id=${encodeURIComponent(data.tenant_id)}`;}catch(err){msg.textContent=err?.message||'Login gagal.';}});</script></body></html>
