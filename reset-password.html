<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buat Password Baru — JFS AI</title><link rel="stylesheet" href="login.css?v=20260916-4"></head><body><main class="login-shell"><section class="login-card"><div class="brand-lockup"><div class="brand-mark"><img src="logo-jfs.png" alt="JFS AI"></div><div><div class="brand-name">JFS AI</div><div class="brand-subtitle">Technology Platform</div></div></div><div class="intro"><span class="eyebrow">PASSWORD RESET</span><h1>Buat password baru</h1><p>Gunakan minimal 8 karakter untuk menjaga keamanan akun.</p></div><form id="form" class="login-form"><label for="password">Password baru</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Ulangi password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="submit" type="submit">Simpan Password <span aria-hidden="true">→</span></button></form><div id="msg" class="msg" role="alert" aria-live="polite"></div></section><p class="footer-note">© 2026 JFS AI Technology</p></main><script src="supabase-config.js"></script><script type="module">import{supabase}from'./auth.js';const form=document.getElementById('form'),p=document.getElementById('password'),c=document.getElementById('confirm'),msg=document.getElementById('msg'),submit=document.getElementById('submit');let ready=false;supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)ready=true});form.onsubmit=async e=>{e.preventDefault();msg.textContent='';if(p.value.length<8)return msg.textContent='Password minimal 8 karakter.';if(p.value!==c.value)return msg.textContent='Konfirmasi password tidak sama.';submit.disabled=true;try{const{error}=await supabase.auth.updateUser({password:p.value});if(error)throw error;msg.textContent='Password berhasil diperbarui. Silakan login kembali.';setTimeout(()=>location.href='login.html',900)}catch(err){msg.textContent=err?.message||'Link reset tidak valid atau sudah kedaluwarsa.'}finally{submit.disabled=false}};</script></body></html>
