<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI — Tenant Management</title><script src="https://cdn.tailwindcss.com"></script><script src="supabase-config.js"></script><script type="module">import { guardSuperAdmin } from './auth-guard.js'; guardSuperAdmin({allowDemo:true});</script></head><body class="bg-slate-950 text-slate-100 min-h-screen font-sans"><div class="max-w-7xl mx-auto p-4 md:p-8 space-y-6"><header class="flex items-center justify-between border-b border-slate-800 pb-5"><div><p class="text-xs text-blue-400 font-bold">JFS AI TECHNOLOGY</p><h1 class="text-2xl font-extrabold">👥 Tenant / SaaS Users</h1><p class="text-xs text-slate-500 mt-1">Daftar usaha yang menggunakan layanan JFS AI.</p></div><a href="super-admin.html" class="bg-slate-800 px-4 py-2 rounded-lg text-xs font-bold">← Super Admin</a></header><div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-950 text-slate-400 text-xs uppercase"><tr><th class="p-3 text-left">Tenant</th><th class="p-3">WhatsApp</th><th class="p-3">Alamat</th><th class="p-3">Paket</th><th class="p-3">Status</th><th class="p-3">Expired</th><th class="p-3">Aksi</th></tr></thead><tbody id="body" class="divide-y divide-slate-800"></tbody></table></div></div></div><script>function read(k,d){try{const x=JSON.parse(localStorage.getItem(k)||'');return x??d}catch(e){return d}}function render(){let ts=read('jfs_tenants',[]);if(!Array.isArray(ts))ts=[];const b=document.getElementById('body');b.innerHTML='';if(!ts.length){b.innerHTML='<tr><td colspan="7" class="p-8 text-center text-slate-500">Belum ada tenant.</td></tr>';return}ts.forEach(t=>{const c=read(`tenant_cfg_${t.id}`,{}),s=c.subscription||{package:'Trial Gratis 6 Hari',status:'Trial'};b.insertAdjacentHTML('beforeend',`<tr><td class="p-3"><b>${c.name||t.name||t.id}</b><div class="text-[10px] text-slate-500">${t.id}</div></td><td class="p-3 text-center">${c.waNumber||'-'}</td><td class="p-3 text-center">${c.address||'-'}</td><td class="p-3 text-center">${s.package||'-'}</td><td class="p-3 text-center"><span class="px-2 py-1 rounded-full text-[10px] bg-emerald-500/10 text-emerald-300">${s.status||'Trial'}</span></td><td class="p-3 text-center">${s.expiredDate||'-'}</td><td class="p-3 text-center"><a href="admin.html?id=${encodeURIComponent(t.id)}" class="text-[10px] bg-slate-800 border border-slate-700 px-2 py-1 rounded">Kelola</a></td></tr>`)})}window.addEventListener('storage',render);render();setInterval(render,3000);</script></body></html>
