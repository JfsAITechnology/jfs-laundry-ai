<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI — Tenant Management</title><script src="https://cdn.tailwindcss.com"></script><script src="supabase-config.js"></script><script type="module">import{guardSuperAdmin}from'./auth-guard.js';await guardSuperAdmin({allowDemo:true});</script></head><body class="bg-slate-950 text-slate-100 min-h-screen font-sans"><main class="max-w-7xl mx-auto p-4 md:p-8 space-y-5"><header class="flex justify-between items-center border-b border-slate-800 pb-5"><div><p class="text-xs text-blue-400 font-bold">JFS AI TECHNOLOGY</p><h1 class="text-2xl font-extrabold">👥 Tenant Management</h1><p class="text-xs text-slate-500">Tambah, edit, aktifkan, nonaktifkan, dan arsipkan tenant.</p></div><a href="super-admin.html" class="bg-slate-800 px-4 py-2 rounded-lg text-xs font-bold">← Super Admin</a></header><div id="msg" class="hidden rounded-xl border px-4 py-3 text-xs"></div><section class="bg-slate-900 border border-slate-800 rounded-xl p-5"><h2 class="font-bold mb-4">➕ Tambahkan Tenant</h2><form id="add" class="grid md:grid-cols-3 gap-3"><input id="code" required placeholder="Kode: fibo-laundry" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs"><input id="name" required placeholder="Nama usaha" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs"><input id="wa" placeholder="WhatsApp 628..." class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs"><input id="phone" placeholder="Telepon" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs"><input id="email" type="email" placeholder="Email" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs"><input id="city" placeholder="Kota" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs"><input id="province" placeholder="Provinsi" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs"><input id="address" placeholder="Alamat" class="bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs md:col-span-2"><button class="md:col-span-3 bg-emerald-600 hover:bg-emerald-500 rounded-lg py-3 text-xs font-bold">Buat Tenant</button></form></section><section class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden"><div class="p-4 border-b border-slate-800 flex justify-between"><div><h2 class="font-bold">🏪 Semua Tenant</h2><p class="text-xs text-slate-500">Tenant berasal dari Supabase, bukan daftar demo tetap.</p></div><button onclick="load()" class="text-xs bg-slate-800 px-3 py-2 rounded-lg">↻ Refresh</button></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-950 text-slate-400 text-xs"><tr><th class="p-3 text-left">Tenant</th><th class="p-3">Kontak</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr></thead><tbody id="rows" class="divide-y divide-slate-800"></tbody></table></div></section></main><script type="module">import{supabase,getSession}from'./auth.js';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,ok=false){$('msg').className=`rounded-xl border px-4 py-3 text-xs ${ok?'border-emerald-500/30 bg-emerald-500/10 text-emerald-300':'border-amber-500/30 bg-amber-500/10 text-amber-300'}`;$('msg').textContent=t;$('msg').classList.remove('hidden')}async function load(){const s=await getSession();if(!s){msg('Login Super Admin diperlukan untuk mengelola tenant produksi.');return}const{data,error}=await supabase.from('tenants').select('id,tenant_code,business_name,phone,whatsapp,email,city,status,ai_enabled').order('created_at',{ascending:false});if(error){msg(error.message);return}$('rows').innerHTML=(data||[]).map(t=>`<tr><td class="p-3"><b>${esc(t.business_name)}</b><div class="text-[10px] text-slate-500">${esc(t.tenant_code)}</div></td><td class="p-3 text-center text-xs">${esc(t.whatsapp||t.phone||'-')}<div class="text-[10px] text-slate-500">${esc(t.city||'')}</div></td><td class="p-3 text-center"><span class="px-2 py-1 rounded-full text-[10px] ${t.status==='active'?'bg-emerald-500/10 text-emerald-300':t.status==='inactive'?'bg-slate-700 text-slate-300':t.status==='suspended'?'bg-red-500/10 text-red-300':'bg-amber-500/10 text-amber-300'}">${esc(t.status)}</span></td><td class="p-3"><div class="flex flex-wrap gap-1 justify-center min-w-[300px]"><a href="admin.html?id=${encodeURIComponent(t.tenant_code)}" class="bg-slate-800 px-2 py-1 rounded text-[10px]">Dashboard</a><a href="index.html?id=${encodeURIComponent(t.tenant_code)}" class="bg-sky-700 px-2 py-1 rounded text-[10px]">Customer</a><button onclick="editTenant('${t.id}')" class="bg-indigo-700 px-2 py-1 rounded text-[10px]">Edit</button><button onclick="setStatus('${t.id}','${t.status}')" class="${t.status==='active'?'bg-amber-700':'bg-emerald-700'} px-2 py-1 rounded text-[10px]">${t.status==='active'?'Nonaktifkan':'Aktifkan'}</button><button onclick="archiveTenant('${t.id}')" class="bg-red-900 px-2 py-1 rounded text-[10px]">Arsipkan</button></div></td></tr>`).join('')||'<tr><td colspan="4" class="p-8 text-center text-xs text-slate-500">Belum ada tenant.</td></tr>'}async function call(name,args){const{error}=await supabase.rpc(name,args);if(error)throw error}window.setStatus=async(id,status)=>{if(!confirm(status==='active'?'Nonaktifkan tenant?':'Aktifkan tenant?'))return;try{const{data,error}=await supabase.from('tenants').select('tenant_code,business_name,phone,whatsapp,email,address,city,province,ai_enabled').eq('id',id).single();if(error)throw error;await call('jfs_superadmin_update_tenant',{p_tenant_id:id,p_tenant_code:data.tenant_code,p_business_name:data.business_name,p_phone:data.phone,p_whatsapp:data.whatsapp,p_email:data.email,p_address:data.address,p_city:data.city,p_province:data.province,p_status:status==='active'?'inactive':'active',p_ai_enabled:data.ai_enabled});msg('Status tenant diperbarui.',true);load()}catch(e){msg(e.message)}};window.editTenant=async id=>{try{const{data,error}=await supabase.from('tenants').select('*').eq('id',id).single();if(error)throw error;const name=prompt('Nama usaha:',data.business_name);if(name===null)return;const wa=prompt('WhatsApp:',data.whatsapp||'');if(wa===null)return;const city=prompt('Kota:',data.city||'');if(city===null)return;const{error:e}=await supabase.rpc('jfs_superadmin_update_tenant',{p_tenant_id:id,p_tenant_code:data.tenant_code,p_business_name:name,p_phone:data.phone,p_whatsapp:wa,p_email:data.email,p_address:data.address,p_city:city,p_province:data.province,p_status:data.status,p_ai_enabled:data.ai_enabled});if(e)throw e;msg('Tenant berhasil diperbarui.',true);load()}catch(e){msg(e.message)}};window.archiveTenant=async id=>{if(!confirm('Arsipkan tenant? Data transaksi tidak dihapus.'))return;try{await call('jfs_superadmin_archive_tenant',{p_tenant_id:id});msg('Tenant diarsipkan. Data transaksi tetap aman.',true);load()}catch(e){msg(e.message)}};$('add').addEventListener('submit',async e=>{e.preventDefault();try{const v=id=>$(id).value.trim();await call('jfs_superadmin_create_tenant',{p_tenant_code:v('code'),p_business_name:v('name'),p_business_type:'laundry',p_phone:v('phone')||null,p_whatsapp:v('wa')||null,p_email:v('email')||null,p_address:v('address')||null,p_city:v('city')||null,p_province:v('province')||null});msg('Tenant berhasil dibuat sebagai Trial.',true);e.target.reset();load()}catch(e){msg(e.message)}});load();</script></body></html>
