<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI — Super Admin</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen font-sans"><div class="max-w-7xl mx-auto p-4 md:p-8 space-y-6"><header class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 border-b border-slate-800 pb-5"><div><p class="text-xs text-blue-400 font-bold">JFS AI TECHNOLOGY</p><h1 class="text-2xl font-extrabold">👑 Super Admin Dashboard</h1><p class="text-xs text-slate-500 mt-1">Monitoring tenant, order, customer, omzet estimasi dan subscription.</p></div><a href="subscription.html" class="bg-indigo-600 px-4 py-2 rounded-lg text-xs font-bold">Subscription</a></header><section class="grid grid-cols-2 lg:grid-cols-5 gap-3"><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500">Tenant</p><b id="tTenants" class="text-2xl">0</b></div><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500">Total Order</p><b id="tOrders" class="text-2xl">0</b></div><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500">Omzet Estimasi</p><b id="tRevenue" class="text-xl text-emerald-400">Rp 0</b></div><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500">Customer</p><b id="tCustomers" class="text-2xl text-blue-400">0</b></div><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500">Aktif/Trial</p><b id="tActive" class="text-2xl text-amber-400">0</b></div></section><section class="bg-slate-900/80 border border-slate-800 rounded-xl overflow-hidden"><div class="p-4 border-b border-slate-800 flex items-center justify-between"><h2 class="font-bold">🏪 Tenant Laundry</h2><button onclick="seedDemo()" class="text-xs bg-slate-800 border border-slate-700 px-3 py-2 rounded-lg">+ Demo Tenant</button></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-950 text-slate-400 text-xs uppercase"><tr><th class="p-3 text-left">Laundry</th><th class="p-3">Order</th><th class="p-3">Omzet Estimasi</th><th class="p-3">Customer</th><th class="p-3">Subscription</th><th class="p-3">Akses</th></tr></thead><tbody id="tenantBody" class="divide-y divide-slate-800"></tbody></table></div></section></div><script>
function readJSON(k,d){try{const x=JSON.parse(localStorage.getItem(k)||'');return x??d}catch(e){return d}}function idr(n){return Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0})}function getTenants(){const t=readJSON('jfs_tenants',[]);return Array.isArray(t)?t:[]}function scanTenant(t){const cfg=readJSON(`tenant_cfg_${t.id}`,{}),orders=readJSON(`jfs_orders_${t.id}`,[]);const arr=Array.isArray(orders)?orders:[];return{cfg,orders:arr,revenue:arr.reduce((s,o)=>s+Number(o.total||0),0),customers:new Set(arr.map(o=>o.phone||o.name).filter(Boolean)).size}}
function render(){const tenants=getTenants();if(!tenants.length){localStorage.setItem('jfs_tenants',JSON.stringify([{id:'demo-asosiasi',name:'Laundry Demo BPLA 2026'}]));}const ts=getTenants();let totalO=0,totalR=0,totalC=0,active=0;const body=document.getElementById('tenantBody');body.innerHTML='';ts.forEach(t=>{const x=scanTenant(t),sub=x.cfg.subscription||{status:'Trial'};totalO+=x.orders.length;totalR+=x.revenue;totalC+=x.customers;if((sub.status||'Trial')!=='Expired')active++;body.insertAdjacentHTML('beforeend',`<tr class="hover:bg-slate-800/60"><td class="p-3"><b>${x.cfg.name||t.name||t.id}</b><div class="text-[10px] text-slate-500">${t.id}</div></td><td class="p-3 text-center font-bold">${x.orders.length}</td><td class="p-3 text-center text-emerald-400 font-bold">${idr(x.revenue)}</td><td class="p-3 text-center">${x.customers}</td><td class="p-3 text-center"><span class="text-[10px] px-2 py-1 rounded-full bg-amber-500/10 text-amber-300">${sub.status||'Trial'}</span></td><td class="p-3 text-center"><div class="flex flex-wrap justify-center gap-1"><a href="admin.html?id=${encodeURIComponent(t.id)}" class="text-[10px] bg-slate-800 border border-slate-700 px-2 py-1 rounded">Admin</a><a href="orders.html?id=${encodeURIComponent(t.id)}" class="text-[10px] bg-sky-700 px-2 py-1 rounded">Orders</a><a href="index.html?id=${encodeURIComponent(t.id)}" class="text-[10px] bg-emerald-700 px-2 py-1 rounded">Customer</a></div></td></tr>`)});document.getElementById('tTenants').innerText=ts.length;document.getElementById('tOrders').innerText=totalO;document.getElementById('tRevenue').innerText=idr(totalR);document.getElementById('tCustomers').innerText=totalC;document.getElementById('tActive').innerText=active}
function seedDemo(){const exists=getTenants();if(!exists.some(x=>x.id==='demo-asosiasi')){exists.push({id:'demo-asosiasi',name:'Laundry Demo BPLA 2026'});localStorage.setItem('jfs_tenants',JSON.stringify(exists));localStorage.setItem('tenant_cfg_demo-asosiasi',JSON.stringify({name:'Laundry Demo BPLA 2026',waNumber:'6282230010172',address:'Surabaya',pricelist:{kiloan:7000,setrika:9000,express:15000},subscription:{package:'Trial Gratis 6 Hari',status:'Trial',expiredDate:'18 September 2026'}}))}render()}window.addEventListener('storage',render);render();setInterval(render,3000);
</script></body></html>
