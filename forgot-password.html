<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lupa Password — JFS AI</title><link rel="stylesheet" href="login.css?v=20260916-4"><style>.helper{margin-top:14px;text-align:center;font-size:13px}.helper a{color:#2563eb;font-weight:700;text-decoration:none}</style></head><body><main class="login-shell"><section class="login-card"><div class="brand-lockup"><div class="brand-mark"><img src="logo-jfs.png" alt="JFS AI"></div><div><div class="brand-name">JFS AI</div><div class="brand-subtitle">Technology Platform</div></div></div><div class="intro"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Lupa password?</h1><p>Masukkan email akun Anda. Kami akan mengirim link untuk membuat password baru.</p></div><form id="form" class="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="nama@email.com" required><button id="submit" type="submit">Kirim Link Reset <span aria-hidden="true">→</span></button></form><div id="msg" class="msg" role="alert" aria-live="polite"></div><div class="helper"><a href="login.html">← Kembali ke Login</a></div></section><p class="footer-note">© 2026 JFS AI Technology</p></main><script src="supabase-config.js"></script><script type="module">import{supabase}from'./auth.js';const form=document.getElementById('form'),email=document.getElementById('email'),msg=document.getElementById('msg'),submit=document.getElementById('submit');form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;submit.textContent='Mengirim…';msg.textContent='';try{const siteUrl=window.location.origin+window.location.pathname.replace(/\/forgot-password\.html$/,'/');const{error}=await supabase.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:siteUrl+'reset-password.html'});if(error)throw error;msg.textContent='Jika email terdaftar, link reset password sudah dikirim. Cek inbox dan folder spam.';form.reset()}catch(err){msg.textContent=err?.message||'Gagal mengirim link reset.'}finally{submit.disabled=false;submit.innerHTML='Kirim Link Reset <span aria-hidden="true">→</span>'}};</script></body></html>
