<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar - JFS AI Laundry</title></head><body><main><h1>Daftar Pengusaha Laundry</h1><p>Trial Gratis 6 Hari.</p><form id="form"><input id="name" placeholder="Nama pemilik / admin" required><input id="business" placeholder="Nama laundry" required><input id="whatsapp" placeholder="Nomor WhatsApp Admin" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="8" placeholder="Password" required><button>Daftar & Mulai Trial</button></form><p id="msg"></p><a href="login.html">Sudah punya akun? Masuk</a></main><script src="supabase-config.js"></script><script type="module">import {supabase}from'./auth.js';const form=document.getElementById('form'),msg=document.getElementById('msg'),nameInput=document.getElementById('name'),businessInput=document.getElementById('business'),whatsappInput=document.getElementById('whatsapp'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Membuat akun...';try{const payload={full_name:nameInput.value.trim(),business_name:businessInput.value.trim(),whatsapp:whatsappInput.value.trim(),business_type:'laundry'};if(!payload.full_name||!payload.business_name||!payload.whatsapp||!emailInput.value.trim()||!passwordInput.value)throw new Error('Mohon lengkapi semua data.');const siteUrl=window.location.origin+window.location.pathname.replace(/\/signup\.html$/,'/');const {data,error}=await supabase.auth.signUp({email:emailInput.value.trim(),password:passwordInput.value,options:{data:payload,emailRedirectTo:siteUrl+'login.html'}});if(error)throw error;if(!data.session){msg.textContent='Akun dibuat. Cek email verifikasi, lalu login kembali. Trial 6 hari akan dibuat otomatis saat login pertama.';return;}const {data:tenantId,error:rpcError}=await supabase.rpc('jfs_create_laundry_tenant',{p_business_name:payload.business_name,p_whatsapp:payload.whatsapp,p_full_name:payload.full_name});if(rpcError)throw rpcError;localStorage.setItem('jfs_current_tenant',tenantId);location.href='admin.html?id='+encodeURIComponent(tenantId);}catch(err){const text=err?.message||'Pendaftaran gagal.';msg.textContent=text.includes('already registered')?'Email sudah terdaftar. Silakan masuk melalui halaman Login.':text;}});</script></body></html>
