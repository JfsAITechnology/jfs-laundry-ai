<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar - JFS AI Laundry</title></head><body><main><h1>Daftar Pengusaha Laundry</h1><p>Trial Gratis 6 Hari.</p><form id="form"><input id="name" placeholder="Nama pemilik / admin" required><input id="business" placeholder="Nama laundry" required><input id="whatsapp" placeholder="Nomor WhatsApp Admin" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="8" placeholder="Password" required><button>Daftar & Mulai Trial</button></form><p id="msg"></p><a href="login.html">Sudah punya akun? Masuk</a></main><script src="supabase-config.js"></script><script type="module">import {supabase} from './auth.js';const form=document.getElementById('form'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Membuat akun...';try{const {data,error}=await supabase.auth.signUp({email:email.value.trim(),password:password.value});if(error)throw error;if(!data.session){msg.textContent='Akun dibuat. Cek email verifikasi, lalu login kembali untuk menyelesaikan pendaftaran.';return;}const {data:tenantId,error:rpcError}=await supabase.rpc('jfs_create_laundry_tenant',{p_business_name:business.value.trim(),p_whatsapp:whatsapp.value.trim(),p_full_name:name.value.trim()});if(rpcError)throw rpcError;localStorage.setItem('jfs_current_tenant',tenantId);location.href='admin.html?id='+encodeURIComponent(tenantId);}catch(err){msg.textContent=err.message||'Pendaftaran gagal.';}});</script></body></html>
