<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin — JFS Laundry AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4 md:p-8">

  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- Header Admin -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-white">⚙️ Dashboard Admin Toko</h1>
        <p class="text-xs text-slate-400" id="display-tenant-id">Tenant ID: default</p>
      </div>
      <a href="subscription.html" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-xs px-3 py-2 rounded-lg transition shadow-lg shadow-blue-500/20">
        🚀 Upgrade / Perpanjang
      </a>
    </header>

    <!-- Widget Status Subscription (FITUR BARU) -->
    <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 flex items-center justify-between">
      <div class="space-y-1">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-slate-400">Status Langganan:</span>
          <span id="sub-status-badge" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase">
            Aktif
          </span>
        </div>
        <p class="text-sm font-bold text-white" id="sub-package-name">Paket 1 Bulan (Rp 100rb)</p>
        <p class="text-[11px] text-slate-400">Berlaku sampai: <span class="text-slate-200 font-medium" id="sub-expired-date">12 October 2026</span></p>
      </div>
      <div class="text-right">
        <span class="text-2xl">🛡️</span>
      </div>
    </div>

    <!-- Form Pengaturan Profil Toko -->
    <section class="bg-slate-800/40 border border-slate-800 rounded-xl p-5 space-y-4">
      <h2 class="text-sm font-bold text-slate-200 border-b border-slate-700/50 pb-2">Profil Toko</h2>
      
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Nama Toko Laundry</label>
          <input type="text" id="admin-store-name" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>
        
        <div>
          <label class="block text-slate-400 mb-1">Nomor WhatsApp Toko (Format 62...)</label>
          <input type="text" id="admin-store-wa" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Alamat Singkat Toko</label>
          <input type="text" id="admin-store-address" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>
    </section>

    <!-- Kelola Pricelist -->
    <section class="bg-slate-800/40 border border-slate-800 rounded-xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700/50 pb-2">
        <h2 class="text-sm font-bold text-slate-200">Daftar Harga & Layanan</h2>
        <button onclick="addPriceRow()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 hover:bg-blue-600/30 text-xs font-semibold px-2.5 py-1 rounded-lg transition">
          + Tambah Layanan
        </button>
      </div>

      <div id="pricelist-rows" class="space-y-2">
        <!-- Row dinamis akan dimuat lewat JS -->
      </div>
    </section>

    <!-- Tombol Aksi -->
    <div class="space-y-2">
      <button onclick="saveAdminData()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-xl transition shadow-lg shadow-emerald-600/20">
        💾 Simpan Perubahan Toko
      </button>
      
      <button onclick="copyCustomerLink()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-semibold text-xs py-2.5 rounded-xl transition">
        📋 Salin Link Portal Customer
      </button>
    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tenantId = urlParams.get('id') || 'default';
    document.getElementById('display-tenant-id').innerText = `Tenant ID: ${tenantId}`;

    // Load Data awal dari LocalStorage
    function loadAdminData() {
      const saved = localStorage.getItem(`tenant_cfg_${tenantId}`);
      let config = {};

      if (saved) {
        try { config = JSON.parse(saved); } catch(e){}
      }

      // Default Value jika belum tersimpan
      document.getElementById('admin-store-name').value = config.name || `Laundry ${tenantId.replace(/-/g, ' ').toUpperCase()}`;
      document.getElementById('admin-store-wa').value = config.waNumber || "6282230010172";
      document.getElementById('admin-store-address').value = config.address || "Surabaya";

      // Render Subscription Info
      const subInfo = config.subscription || {
        package: "Trial Gratis 6 Hari",
        status: "Trial",
        expiredDate: "18 September 2026"
      };

      document.getElementById('sub-package-name').innerText = subInfo.package;
      document.getElementById('sub-status-badge').innerText = subInfo.status;
      document.getElementById('sub-expired-date').innerText = subInfo.expiredDate;

      // Style Badge Berdasarkan Status
      const badge = document.getElementById('sub-status-badge');
      if (subInfo.status === 'Trial') {
        badge.className = "bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase";
      } else if (subInfo.status === 'Expired') {
        badge.className = "bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase";
      }

      // Render Pricelist
      const rowContainer = document.getElementById('pricelist-rows');
      rowContainer.innerHTML = '';
      const pricelist = config.pricelist || { kiloan: 7000, setrika: 9000, express: 15000 };

      Object.entries(pricelist).forEach(([service, price]) => {
        addPriceRow(service, price);
      });
    }

    function addPriceRow(serviceName = '', priceValue = '') {
      const container = document.getElementById('pricelist-rows');
      const row = document.createElement('div');
      row.className = "flex gap-2 items-center price-row";
      row.innerHTML = `
        <input type="text" placeholder="Nama Layanan (ex: Kiloan)" value="${serviceName}" class="service-key w-1/2 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
        <input type="number" placeholder="Harga (ex: 8000)" value="${priceValue}" class="service-price w-1/2 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none">
        <button onclick="this.parentElement.remove()" class="text-rose-400 hover:text-rose-300 px-2 font-bold text-xs">✕</button>
      `;
      container.appendChild(row);
    }

    function saveAdminData() {
      const name = document.getElementById('admin-store-name').value.trim();
      const waNumber = document.getElementById('admin-store-wa').value.trim();
      const address = document.getElementById('admin-store-address').value.trim();

      // Collect Pricelist
      const pricelist = {};
      document.querySelectorAll('.price-row').forEach(row => {
        const key = row.querySelector('.service-key').value.trim().toLowerCase();
        const val = Number(row.querySelector('.service-price').value);
        if (key && !isNaN(val)) {
          pricelist[key] = val;
        }
      });

      // Maintain Subscription status
      const existing = JSON.parse(localStorage.getItem(`tenant_cfg_${tenantId}`) || '{}');
      const subscription = existing.subscription || {
        package: "Trial Gratis 6 Hari",
        status: "Trial",
        expiredDate: "18 September 2026"
      };

      const updatedConfig = { name, waNumber, address, pricelist, subscription };
      localStorage.setItem(`tenant_cfg_${tenantId}`, JSON.stringify(updatedConfig));

      alert('✅ Data toko berhasil diperbarui!');
    }

    function copyCustomerLink() {
      const customerUrl = `${window.location.origin}${window.location.pathname.replace('admin.html', 'index.html')}?id=${tenantId}`;
      navigator.clipboard.writeText(customerUrl);
      alert(`Link Customer berhasil disalin:\n${customerUrl}`);
    }

    window.addEventListener('DOMContentLoaded', loadAdminData);
  </script>
</body>
</html>
