<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Admin — JFS Laundry AI</title><link rel="stylesheet" href="jfs-ui.css?v=20260916-2"><script src="supabase-config.js?v=20260916-5"></script></head><body><main class="app"><header class="panel"><div style="display:flex;align-items:center;gap:12px"><img src="logo-jfs.png" alt="JFS AI" style="width:52px;height:52px"><div><b>JFS AI TECHNOLOGY</b><h1>Dashboard Admin</h1><div id="display-business" class="muted">Memuat usaha...</div></div></div><div class="top-actions"><a id="customerLink" class="nav">👁️ Customer</a><button id="themeToggle" class="nav">🌙 Mode</button><button id="logoutBtn" class="nav">Keluar</button></div></header><nav class="nav" style="margin:16px 0"><a id="ordersLink">📦 Pesanan</a><a id="historyLink">📋 Riwayat</a><a id="omzetLink">💰 Omzet</a><a id="subscriptionLink">🚀 Subscription</a></nav><section class="grid4"><div class="stat"><div class="muted">Pesanan Aktif</div><b id="statOrders">0</b></div><div class="stat"><div class="muted">Omzet Aktif</div><b id="statRevenue">Rp 0</b></div><div class="stat"><div class="muted">Customer Aktif</div><b id="statCustomers">0</b></div><div class="stat"><div class="muted">Menunggu Jemput</div><b id="statPending">0</b></div></section><section class="panel" style="margin-top:16px"><h2>📊 Pesanan Terbaru</h2><div id="recentOrders"></div><button id="refresh-dashboard">↻ Refresh</button></section><section class="panel" style="margin-top:16px"><h2>🏪 Profil Usaha</h2><label>Nama Usaha<input id="admin-store-name"></label><label>WhatsApp<input id="admin-store-wa"></label><label>Alamat<input id="admin-store-address"></label></section><section class="panel" style="margin-top:16px"><h2>🏷️ Layanan & Tarif</h2><div id="pricelist-rows"></div><button id="add-price-row">+ Tambah Layanan</button></section><div id="message" class="message"></div><button id="save-admin-changes" class="save">💾 Simpan Perubahan</button></main><script type="module">import{supabase,requireTenantRole,redirectToLogin}from'./auth.js?v=20260916-5';const params=new URLSearchParams(location.search),code=params.get('id')||localStorage.getItem('jfs_current_tenant')||'JFS-LAUNDRY-DEMO-001',demo=code==='JFS-LAUNDRY-DEMO-001';let business,products=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});function msg(t,ok=true){const e=$('message');if(!e)return; e.textContent=t;e.className='message show '+(ok?'ok':'err')}function setHref(id,url){const e=$(id);if(e)e.href=url}async function guard(){const r=await requireTenantRole(code,['owner','admin'],{allowDemo:true});if(r.mode==='login'){redirectToLogin(location.href);return false}if(r.mode==='forbidden'){msg('Akses tenant ditolak.',false);return false}return true}async function resolve(){const r=await supabase.rpc('jfs_get_tenant_context_by_code',{p_tenant_code:code});if(r.error)throw r.error;if(!r.data?.length)throw Error('Usaha tidak ditemukan.');business=r.data[0];$('display-business').textContent=business.business_name||business.tenant_code;const q='?id='+encodeURIComponent(business.tenant_code||code);setHref('customerLink','index.html'+q);setHref('ordersLink','orders.html'+q);setHref('historyLink','history.html'+q);setHref('omzetLink','omzet.html'+q);setHref('subscriptionLink','subscription.html'+q);$('admin-store-name').value=business.business_name||'';$('admin-store-wa').value=business.whatsapp||business.phone||'';$('admin-store-address').value=business.address||''}async function loadSubscription(){const r=await supabase.rpc('jfs_get_my_laundry_subscription_summary');if(!r.error&&r.data?.[0]){} }async function loadOrders(){const r=await supabase.rpc('jfs_admin_recent_orders',{p_tenant_id:business.id});if(r.error)throw r.error;const active=(r.data||[]).filter(o=>!['completed','cancelled'].includes(o.status));$('statOrders').textContent=active.length;$('statRevenue').textContent=idr(active.reduce((s,o)=>s+Number(o.total_amount||0),0));$('statCustomers').textContent=new Set(active.map(o=>{try{const m=JSON.parse(o.notes||'{}');return m.phone||m.name}catch{return''}}).filter(Boolean)).size;$('statPending').textContent=active.filter(o=>o.status==='pending').length;$('recentOrders').innerHTML=active.slice(0,5).map(o=>`<div class="order-card"><b>${esc(o.external_id||o.id)}</b> — ${idr(o.total_amount)} — ${esc(o.status)}</div>`).join('')||'<div class="muted">Belum ada pesanan aktif.</div>'}async function loadProducts(){const fn=demo?'jfs_admin_list_demo_products':'jfs_admin_list_products_v2',args=demo?{}:{p_tenant_id:business.id},r=await supabase.rpc(fn,args);if(r.error)throw r.error;products=r.data||[];$('pricelist-rows').innerHTML='';products.filter(p=>p.is_active).forEach(addRow);if(!products.length)addRow()}function addRow(p={}){const row=document.createElement('div');row.className='price-row';row.dataset.id=p.id||'';row.innerHTML=`<input class="service-name" placeholder="Nama layanan" value="${esc(p.name||'')}"><input class="service-price" type="number" min="1" placeholder="Harga Rp" value="${p.price??''}"><button class="remove">Hapus</button>`;row.querySelector('.remove').onclick=()=>row.remove();$('pricelist-rows').appendChild(row)}$('add-price-row').onclick=()=>addRow();$('save-admin-changes').onclick=async()=>{try{const u=await supabase.rpc('jfs_admin_update_tenant',{p_tenant_id:business.id,p_business_name:$('admin-store-name').value.trim(),p_whatsapp:$('admin-store-wa').value.trim(),p_address:$('admin-store-address').value.trim()});if(u.error)throw u.error;msg('Perubahan berhasil disimpan.');await refresh()}catch(e){msg(e.message||'Gagal menyimpan.',false)}};async function refresh(){await resolve();await Promise.all([loadOrders(),loadProducts(),loadSubscription()])}$('refresh-dashboard').onclick=refresh;$('logoutBtn').onclick=async()=>{await supabase.auth.signOut();localStorage.removeItem('jfs_current_tenant');location.href='login.html'};$('themeToggle').onclick=()=>document.documentElement.classList.toggle('dark');if(await guard())refresh().catch(e=>msg('Demo Dashboard gagal dimuat: '+(e.message||e),false));</script></body></html>
