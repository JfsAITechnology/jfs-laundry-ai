<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard Admin — JFS Laundry AI</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 md:p-8"><div class="max-w-6xl mx-auto space-y-5">
<header class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 border-b border-slate-800 pb-4"><div><h1 class="text-xl font-bold">⚙️ Dashboard Admin Laundry</h1><p class="text-xs text-slate-400" id="display-tenant-id"></p></div><div class="flex gap-2"><a id="ordersLink" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-3 py-2 rounded-lg">📦 Order Management</a><a href="subscription.html" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-2 rounded-lg">🚀 Subscription</a></div></header>
<section class="grid grid-cols-2 lg:grid-cols-4 gap-3"><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-[11px] text-slate-400">Total Order</p><b id="statOrders" class="text-2xl">0</b></div><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-[11px] text-slate-400">Omzet Estimasi</p><b id="statRevenue" class="text-2xl text-emerald-400">Rp 0</b></div><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-[11px] text-slate-400">Customer</p><b id="statCustomers" class="text-2xl text-blue-400">0</b></div><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-[11px] text-slate-400">Menunggu</p><b id="statPending" class="text-2xl text-amber-400">0</b></div></section>
<section class="bg-slate-900/80 border border-slate-800 rounded-xl p-5"><div class="flex items-center justify-between mb-4"><h2 class="font-bold">📊 Order Terbaru</h2><span id="subBadge" class="text-[10px] px-2 py-1 rounded-full bg-amber-500/15 text-amber-300">Trial</span></div><div id="recentOrders" class="space-y-2"></div><a id="viewAll" class="block text-center mt-4 text-xs text-sky-400 hover:text-sky-300">Lihat semua order →</a></section>
<section class="bg-slate-900/60 border border-slate-800 rounded-xl p-5"><h2 class="text-sm font-bold border-b border-slate-800 pb-2 mb-4">Profil & Pengaturan Toko</h2><div class="grid md:grid-cols-3 gap-3 text-xs"><div><label class="text-slate-400">Nama Toko</label><input id="admin-store-name" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5"></div><div><label class="text-slate-400">WhatsApp Toko (62...)</label><input id="admin-store-wa" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5"></div><div><label class="text-slate-400">Alamat</label><input id="admin-store-address" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5"></div></div></section>
<section class="bg-slate-900/60 border border-slate-800 rounded-xl p-5"><div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-3"><h2 class="text-sm font-bold">Daftar Harga & Layanan</h2><button onclick="addPriceRow()" class="text-xs bg-blue-600 px-3 py-1.5 rounded-lg">+ Tambah</button></div><div id="pricelist-rows" class="space-y-2"></div></section>
<div class="grid md:grid-cols-2 gap-2"><button onclick="saveAdminData()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-xl">💾 Simpan Perubahan</button><button onclick="copyCustomerLink()" class="bg-slate-900 border border-slate-700 text-xs py-3 rounded-xl">📋 Salin Link Customer</button></div>
</div><script>
const tenantId=new URLSearchParams(location.search).get('id')||'demo-asosiasi';const KEY=`tenant_cfg_${tenantId}`,ORDER_KEY=`jfs_orders_${tenantId}`;document.getElementById('display-tenant-id').innerText=`Tenant ID: ${tenantId}`;document.getElementById('ordersLink').href=`orders.html?id=${tenantId}`;document.getElementById('viewAll').href=`orders.html?id=${tenantId}`;
function readCfg(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}function readOrders(){try{const x=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
function formatIDR(n){return Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0})}
function refreshDashboard(){const orders=readOrders();const customers=new Set(orders.map(o=>o.phone||o.name).filter(Boolean));document.getElementById('statOrders').innerText=orders.length;document.getElementById('statRevenue').innerText=formatIDR(orders.reduce((s,o)=>s+Number(o.total||0),0));document.getElementById('statCustomers').innerText=customers.size;document.getElementById('statPending').innerText=orders.filter(o=>o.status==='Menunggu Jemput').length;const box=document.getElementById('recentOrders');box.innerHTML='';orders.slice(0,5).forEach(o=>{box.insertAdjacentHTML('beforeend',`<div class="flex items-center justify-between gap-3 bg-slate-950 border border-slate-800 rounded-lg p-3"><div><b class="text-xs">${o.name||'-'}</b><p class="text-[10px] text-slate-400">${o.service||'-'} • ${o.weight||'-'} • ${o.id||'-'}</p></div><div class="text-right"><b class="text-xs text-emerald-400">${formatIDR(o.total)}</b><p class="text-[10px] text-amber-300">${o.status||'-'}</p></div></div>`)});if(!orders.length)box.innerHTML='<p class="text-xs text-slate-500">Belum ada order. Order customer akan tampil di sini otomatis.</p>';const c=readCfg();const sub=c.subscription||{package:'Trial Gratis 6 Hari',status:'Trial'};document.getElementById('subBadge').innerText=sub.status||'Trial';document.getElementById('admin-store-name').value=c.name||`Laundry ${tenantId.replace(/-/g,' ')}`;document.getElementById('admin-store-wa').value=c.waNumber||'6282230010172';document.getElementById('admin-store-address').value=c.address||'Surabaya';const p=c.pricelist||{kiloan:7000,setrika:9000,express:15000};const r=document.getElementById('pricelist-rows');r.innerHTML='';Object.entries(p).forEach(([k,v])=>addPriceRow(k,v));}
function addPriceRow(k='',v=''){const r=document.createElement('div');r.className='flex gap-2 price-row';r.innerHTML=`<input class="service-key flex-1 bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs" value="${k}" placeholder="Layanan"><input class="service-price w-36 bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs" type="number" value="${v}" placeholder="Harga"><button onclick="this.parentElement.remove()" class="text-rose-400 px-2">✕</button>`;document.getElementById('pricelist-rows').appendChild(r)}
function saveAdminData(){const existing=readCfg(),pricelist={};document.querySelectorAll('.price-row').forEach(r=>{const k=r.querySelector('.service-key').value.trim().toLowerCase(),v=Number(r.querySelector('.service-price').value);if(k&&Number.isFinite(v))pricelist[k]=v});const config={...existing,name:document.getElementById('admin-store-name').value.trim(),waNumber:document.getElementById('admin-store-wa').value.trim().replace(/\D/g,''),address:document.getElementById('admin-store-address').value.trim(),pricelist,subscription:existing.subscription||{package:'Trial Gratis 6 Hari',status:'Trial',expiredDate:'18 September 2026'}};localStorage.setItem(KEY,JSON.stringify(config));let tenants=[];try{tenants=JSON.parse(localStorage.getItem('jfs_tenants')||'[]')}catch(e){};const item={id:tenantId,name:config.name};tenants=[...tenants.filter(x=>x.id!==tenantId),item];localStorage.setItem('jfs_tenants',JSON.stringify(tenants));alert('✅ Data toko tersimpan.');refreshDashboard()}
function copyCustomerLink(){const u=`${location.origin}${location.pathname.replace('admin.html','index.html')}?id=${tenantId}`;navigator.clipboard?.writeText(u).then(()=>alert('Link customer disalin.')).catch(()=>prompt('Salin link ini:',u))}
window.addEventListener('storage',refreshDashboard);window.addEventListener('DOMContentLoaded',refreshDashboard);setInterval(refreshDashboard,3000);
</script></body></html>
