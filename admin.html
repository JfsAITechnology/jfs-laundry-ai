<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Admin — JFS Laundry AI</title><script src="https://cdn.tailwindcss.com"></script><script src="supabase-config.js"></script><script src="admin-price-fix.js?v=20260914-2"></script><script src="admin-save-fix.js?v=20260914-2"></script><script type="module">const p=new URLSearchParams(location.search);const id=p.get('id')||'JFS-LAUNDRY-DEMO-001';const demoIds=new Set(['JFS-LAUNDRY-DEMO-001','JFS-DEMO-LAUNDRY','demo-asosiasi']);if(!demoIds.has(id)){const{guardTenantPage}=await import('./auth-guard.js');await guardTenantPage();}</script></head><body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8"><main class="max-w-6xl mx-auto space-y-5"><header class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 border-b border-slate-800 pb-4"><div class="flex items-start gap-3 min-w-0"><img src="logo-jfs.png" alt="JFS AI" class="w-12 h-12 rounded-xl object-contain bg-white p-1 shrink-0"><div class="min-w-0"><p class="text-xs text-blue-400 font-bold">JFS AI TECHNOLOGY</p><h1 class="text-xl font-bold">⚙️ Dashboard Admin Laundry</h1><p class="text-xs text-slate-400" id="display-tenant-id">Memuat...</p></div></div><div class="flex flex-wrap gap-2"><a id="ordersLink" class="bg-sky-600 text-white text-xs font-bold px-3 py-2 rounded-lg">📦 Order Management</a><a id="historyLink" class="bg-purple-600 text-white text-xs font-bold px-3 py-2 rounded-lg">📋 Riwayat</a><a id="omzetLink" class="bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-lg">📈 Omzet</a><a id="subscriptionLink" class="bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-lg">🚀 Subscription</a></div></header><section class="grid grid-cols-2 lg:grid-cols-4 gap-3"><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-[11px] text-slate-400">Order Aktif</p><b id="statOrders" class="text-2xl">0</b></div><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-[11px] text-slate-400">Omzet Aktif</p><b id="statRevenue" class="text-2xl text-emerald-400">Rp 0</b></div><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-[11px] text-slate-400">Customer Aktif</p><b id="statCustomers" class="text-2xl text-blue-400">0</b></div><div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-[11px] text-slate-400">Menunggu</p><b id="statPending" class="text-2xl text-amber-400">0</b></div></section><section class="bg-slate-900/80 border border-slate-800 rounded-xl p-5"><div class="flex items-center justify-between mb-4"><div><h2 class="font-bold">📊 Order Terbaru</h2><p class="text-[10px] text-slate-500">Data langsung dari Supabase.</p></div><span id="subBadge" class="text-[10px] px-2 py-1 rounded-full bg-amber-500/15 text-amber-300">Trial</span></div><div id="recentOrders" class="space-y-2"></div><div class="flex gap-2 mt-4"><a id="viewAll" class="flex-1 block text-center text-xs bg-sky-600 py-2 rounded-lg">📦 Kelola Semua Order</a><button onclick="refreshDashboard()" class="text-xs bg-slate-800 border border-slate-700 px-4 rounded-lg">↻ Refresh</button></div></section><section class="bg-slate-900/60 border border-slate-800 rounded-xl p-5"><h2 class="text-sm font-bold border-b border-slate-800 pb-2 mb-4">Profil & Pengaturan Toko</h2><div class="grid md:grid-cols-3 gap-3 text-xs"><div><label class="text-slate-400">Nama Toko</label><input id="admin-store-name" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5"></div><div><label class="text-slate-400">WhatsApp Toko</label><input id="admin-store-wa" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5"></div><div><label class="text-slate-400">Alamat</label><input id="admin-store-address" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5"></div></div></section><section class="bg-slate-900/60 border border-slate-800 rounded-xl p-5"><div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-3"><h2 class="text-sm font-bold">Daftar Harga & Layanan</h2><button id="add-price-row" type="button" class="text-xs bg-blue-600 px-3 py-1.5 rounded-lg">+ Tambah</button></div><div id="pricelist-rows" class="space-y-2"></div></section><button id="save-admin-changes" type="button" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-xl">💾 Simpan Perubahan</button></main><script type="module">import{supabase}from'./auth.js';const tenantCode=new URLSearchParams(location.search).get('id')||'JFS-LAUNDRY-DEMO-001';let tenant=null,products=[];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));const idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});async function resolveTenant(){const{data,error}=await supabase.from('tenants').select('id,tenant_code,business_name,whatsapp,phone,address,city,province').eq('tenant_code',tenantCode).maybeSingle();if(error||!data)throw Error('Tenant tidak ditemukan');tenant=data;document.getElementById('display-tenant-id').textContent=tenant.business_name||'JFS Laundry AI';const links={ordersLink:`orders.html?id=${encodeURIComponent(tenantCode)}`,viewAll:`orders.html?id=${encodeURIComponent(tenantCode)}`,historyLink:`history.html?id=${encodeURIComponent(tenantCode)}`,omzetLink:`omzet.html?id=${encodeURIComponent(tenantCode)}`,subscriptionLink:`subscription.html?id=${encodeURIComponent(tenantCode)}`};Object.entries(links).forEach(([id,href])=>document.getElementById(id).href=href);document.getElementById('admin-store-name').value=tenant.business_name||'';document.getElementById('admin-store-wa').value=tenant.whatsapp||tenant.phone||'';document.getElementById('admin-store-address').value=tenant.address||''}async function loadOrders(){const{data,error}=await supabase.from('jfs_orders').select('id,external_id,status,total_amount,notes,created_at').eq('tenant_id',tenant.id).order('created_at',{ascending:false}).limit(50);if(error)throw error;const active=(data||[]).filter(o=>!['completed','cancelled'].includes(o.status));document.getElementById('statOrders').textContent=active.length;document.getElementById('statRevenue').textContent=idr(active.reduce((s,o)=>s+Number(o.total_amount||0),0));document.getElementById('statCustomers').textContent=new Set(active.map(o=>{try{return JSON.parse(o.notes||'{}').phone||JSON.parse(o.notes||'{}').name}catch{return''}}).filter(Boolean)).size;document.getElementById('statPending').textContent=active.filter(o=>o.status==='pending').length;const box=document.getElementById('recentOrders');box.innerHTML='';active.slice(0,5).forEach(o=>{let m={};try{m=JSON.parse(o.notes||'{}')}catch{};const status={pending:'Menunggu Jemput',processing:'Dalam Proses',ready:'Siap Diambil'}[o.status]||o.status;box.insertAdjacentHTML('beforeend',`<div class="flex flex-col md:flex-row md:items-center justify-between gap-3 bg-slate-950 border border-slate-800 rounded-lg p-3"><div><b class="text-xs">${esc(m.name||'-')}</b><p class="text-[10px] text-slate-400">${esc(m.service||'-')} • ${esc((m.quantity||'-')+' '+(m.unit||''))} • ${esc(o.external_id||o.id)}</p></div><div class="flex items-center gap-2"><b class="text-xs text-emerald-400">${idr(o.total_amount)}</b><span class="text-[10px] text-amber-300">${esc(status)}</span><a href="orders.html?id=${encodeURIComponent(tenantCode)}" class="text-[10px] bg-slate-800 px-2 py-1 rounded">Kelola</a></div></div>`)});if(!active.length)box.innerHTML='<p class="text-xs text-slate-500">Belum ada order aktif.</p>'}async function loadProducts(){const{data,error}=await supabase.from('products').select('id,name,price,is_active').eq('tenant_id',tenant.id).order('name');if(error)throw error;products=data||[];const box=document.getElementById('pricelist-rows');box.innerHTML='';products.filter(p=>p.is_active).forEach(p=>window.JFSAdminPriceUI?.addRow(p));if(!products.filter(p=>p.is_active).length)window.JFSAdminPriceUI?.addRow()}async function saveAdminChanges(){const button=document.getElementById('save-admin-changes');button.disabled=true;button.textContent='Menyimpan...';try{const name=document.getElementById('admin-store-name').value.trim(),wa=document.getElementById('admin-store-wa').value.replace(/\D/g,''),address=document.getElementById('admin-store-address').value.trim();if(!name)throw Error('Nama toko wajib diisi.');const rows=[...document.querySelectorAll('.price-row')].map(r=>({id:r.dataset.id||'',name:r.querySelector('.service-key')?.value.trim()||'',price:Number(r.querySelector('.service-price')?.value)}));const validRows=rows.filter(x=>x.name&&Number.isFinite(x.price)&&x.price>0);if(rows.some(x=>!x.name||!Number.isFinite(x.price)||x.price<=0))throw Error('Setiap layanan harus memiliki nama dan harga lebih dari 0.');const{error:te}=await supabase.from('tenants').update({business_name:name,whatsapp:wa,address,updated_at:new Date().toISOString()}).eq('id',tenant.id).select('id').single();if(te)throw te;const keep=new Set();for(const r of validRows){if(r.id){const{data,error}=await supabase.from('products').update({name:r.name,price:r.price,is_active:true,updated_at:new Date().toISOString()}).eq('id',r.id).eq('tenant_id',tenant.id).select('id').single();if(error)throw error;if(!data)throw Error('Layanan tidak ditemukan saat diperbarui.');keep.add(r.id)}else{const{data,error}=await supabase.from('products').insert({tenant_id:tenant.id,name:r.name,price:r.price,is_active:true}).select('id').single();if(error)throw error;keep.add(data.id)}}for(const p of products.filter(x=>x.is_active))if(!keep.has(p.id)){const{error}=await supabase.from('products').update({is_active:false,updated_at:new Date().toISOString()}).eq('id',p.id).eq('tenant_id',tenant.id);if(error)throw error}alert('✅ Perubahan tersimpan ke database.');await resolveTenant();await loadProducts();await loadOrders()}catch(e){console.error(e);alert('Gagal menyimpan: '+(e?.message||e))}finally{button.disabled=false;button.textContent='💾 Simpan Perubahan'}}window.JFSAdminSave=saveAdminChanges;window.refreshDashboard=async()=>{await loadOrders()};async function boot(){try{await resolveTenant();await Promise.all([loadProducts(),loadOrders()]);window.JFSAdminPriceUI?.bind()}catch(e){document.body.innerHTML=`<main class="p-8 text-red-400">${esc(e.message)}</main>`}}boot();setInterval(()=>loadOrders().catch(console.error),5000);</script></body></html>
