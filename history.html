<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Riwayat Order — JFS Laundry AI</title><script src="https://cdn.tailwindcss.com"></script><script src="supabase-config.js"></script><script type="module">import { guardTenantPage } from './auth-guard.js'; guardTenantPage();</script></head><body class="bg-slate-50 text-slate-800 min-h-screen"><header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md"><div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3"><div><h1 class="font-bold text-lg">📋 Riwayat Order</h1><p class="text-xs text-sky-400" id="tenantLabel"></p></div><div class="flex gap-2"><a id="navAdmin" class="text-xs bg-slate-800 px-3 py-2 rounded-lg">⚙️ Admin</a><a id="navOrders" class="text-xs bg-sky-600 px-3 py-2 rounded-lg">📦 Order Aktif</a></div></div></header><main class="max-w-7xl mx-auto px-4 py-6"><section class="bg-white border rounded-xl shadow-sm p-4 mb-5"><div class="grid md:grid-cols-5 gap-3"><input id="search" placeholder="Cari nama, nomor order, atau HP..." class="px-3 py-2 text-sm border rounded-lg md:col-span-2"><input id="dateFrom" type="date" class="px-3 py-2 text-sm border rounded-lg" title="Tanggal mulai"><input id="dateTo" type="date" class="px-3 py-2 text-sm border rounded-lg" title="Tanggal akhir"><select id="status" class="px-3 py-2 text-sm border rounded-lg"><option value="">Semua status</option><option>Menunggu Jemput</option><option>Dalam Proses</option><option>Siap Diambil</option><option>Selesai</option></select></div><div class="flex gap-2 mt-3"><button onclick="refreshHistory()" class="bg-slate-100 px-4 py-2 rounded-lg text-sm">↻ Refresh</button><button onclick="resetFilters()" class="bg-purple-50 text-purple-700 border border-purple-200 px-4 py-2 rounded-lg text-sm">Reset Filter</button></div></section><section class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-5"><div class="bg-white border rounded-xl p-4"><p class="text-xs text-slate-500">Transaksi</p><b id="count" class="text-2xl">0</b></div><div class="bg-white border rounded-xl p-4"><p class="text-xs text-slate-500">Total Transaksi</p><b id="revenue" class="text-xl text-emerald-600">Rp 0</b></div><div class="bg-white border rounded-xl p-4"><p class="text-xs text-slate-500">Diarsipkan</p><b id="archived" class="text-2xl text-purple-600">0</b></div></section><section class="bg-white border rounded-xl shadow-sm overflow-hidden"><div class="px-4 py-3 border-b"><h2 class="font-bold">Semua Transaksi Lama</h2><p class="text-xs text-slate-500">Data tetap tersimpan. Restore mengembalikan order ke daftar aktif.</p></div><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="bg-slate-900 text-slate-200 text-xs uppercase"><th class="p-3">Tanggal</th><th class="p-3">Order</th><th class="p-3">Customer</th><th class="p-3">Layanan</th><th class="p-3">Status</th><th class="p-3">Total</th><th class="p-3">Aksi</th></tr></thead><tbody id="body" class="divide-y"></tbody></table></div><div id="empty" class="hidden py-12 text-center text-slate-400">Belum ada transaksi yang cocok.</div></section></main><script>
const tenantId=new URLSearchParams(location.search).get('id')||'demo-asosiasi',KEY=`jfs_orders_${tenantId}`;document.getElementById('tenantLabel').innerText=`Tenant ID: ${tenantId}`;document.getElementById('navAdmin').href=`admin.html?id=${encodeURIComponent(tenantId)}`;document.getElementById('navOrders').href=`orders.html?id=${encodeURIComponent(tenantId)}`;
function readOrders(){try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(d)?d:[]}catch(e){return []}}
function writeOrders(orders){localStorage.setItem(KEY,JSON.stringify(orders));window.dispatchEvent(new Event('orders-updated'))}
function idr(n){return Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0})}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function orderDate(o){const raw=o.timestamp||o.created_at||o.archived_at||'';if(o.archived_at)return new Date(o.archived_at);const m=String(raw).match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(`${m[3]}-${m[2]}-${m[1]}T12:00:00`):new Date(raw)}
function render(){const all=readOrders(),q=document.getElementById('search').value.trim().toLowerCase(),status=document.getElementById('status').value,from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value;const rows=all.filter(o=>o.status==='Selesai'||o.active===false).filter(o=>{const text=`${o.name||''} ${o.id||''} ${o.phone||''}`.toLowerCase();if(q&&!text.includes(q))return false;if(status&&o.status!==status)return false;const d=orderDate(o);if(from&&!Number.isNaN(d.getTime())&&d<new Date(`${from}T00:00:00`))return false;if(to&&!Number.isNaN(d.getTime())&&d>new Date(`${to}T23:59:59`))return false;return true});document.getElementById('count').innerText=rows.length;document.getElementById('revenue').innerText=idr(rows.reduce((s,o)=>s+Number(o.total||0),0));document.getElementById('archived').innerText=rows.filter(o=>o.active===false).length;const body=document.getElementById('body'),empty=document.getElementById('empty');body.innerHTML='';if(!rows.length){empty.classList.remove('hidden');return}empty.classList.add('hidden');rows.sort((a,b)=>orderDate(b)-orderDate(a)).forEach(o=>{const statusClass=o.status==='Selesai'?'bg-emerald-100 text-emerald-800':o.status==='Siap Diambil'?'bg-purple-100 text-purple-800':o.status==='Dalam Proses'?'bg-blue-100 text-blue-800':'bg-amber-100 text-amber-800';const archivedLabel=o.active===false?'<span class="ml-1 text-[10px] bg-slate-100 text-slate-600 px-2 py-1 rounded">Arsip</span>':'';const tr=document.createElement('tr');tr.className='hover:bg-slate-50';tr.innerHTML=`<td class="p-3 text-xs text-slate-500">${esc(o.timestamp||o.archived_at||'-')}</td><td class="p-3 font-bold">${esc(o.id||'-')}</td><td class="p-3"><b>${esc(o.name||'-')}</b><div class="text-xs text-slate-500">${esc(o.phone||'-')}</div></td><td class="p-3 text-xs">${esc(o.service||'-')}<div class="text-slate-500">${esc(o.weight||'-')}</div></td><td class="p-3"><span class="px-2 py-1 rounded-full text-[10px] ${statusClass}">${esc(o.status||'-')}</span>${archivedLabel}</td><td class="p-3 font-bold">${idr(o.total)}</td><td class="p-3"><div class="flex flex-wrap gap-1.5"><button onclick="viewDetail('${esc(o.id)}')" class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1.5 rounded">👁️ Detail</button><button onclick="restoreOrder('${esc(o.id)}')" class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs px-2.5 py-1.5 rounded">↩ Restore</button></div></td>`;body.appendChild(tr)})}
function viewDetail(id){const o=readOrders().find(x=>x.id===id);if(!o)return;alert(`Order ${o.id}\n\nCustomer: ${o.name||'-'}\nNo. HP: ${o.phone||'-'}\nLayanan: ${o.service||'-'}\nJumlah: ${o.weight||'-'}\nAlamat: ${o.address||'-'}\nStatus: ${o.status||'-'}\nTotal: ${idr(o.total)}\nDiarsipkan: ${o.archived_at?new Date(o.archived_at).toLocaleString('id-ID'):'Belum diarsipkan'}`)}
function restoreOrder(id){const orders=readOrders(),o=orders.find(x=>x.id===id);if(!o)return;if(!confirm(`Kembalikan ${id} ke Order Aktif?`))return;o.active=true;o.archived_at=null;o.updated_at=new Date().toISOString();writeOrders(orders);render()}
function refreshHistory(){render()}function resetFilters(){['search','dateFrom','dateTo'].forEach(id=>document.getElementById(id).value='');document.getElementById('status').value='';render()}
['search','dateFrom','dateTo','status'].forEach(id=>document.getElementById(id).addEventListener('input',render));window.addEventListener('storage',render);window.addEventListener('orders-updated',render);window.addEventListener('DOMContentLoaded',render);setInterval(render,3000);
</script></body></html>
