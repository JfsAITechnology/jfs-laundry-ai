<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat Order — JFS Laundry AI</title><script src="https://cdn.tailwindcss.com"></script><script src="supabase-config.js"></script><script type="module">import{guardTenantPage}from'./auth-guard.js';await guardTenantPage();</script></head><body class="bg-slate-50 text-slate-800 min-h-screen"><header class="bg-slate-900 text-white sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3"><div><h1 class="font-bold">📋 Riwayat Order</h1><p class="text-xs text-sky-400" id="tenantLabel">Memuat...</p></div><div class="flex gap-2"><a id="navAdmin" class="text-xs bg-slate-800 px-3 py-2 rounded">⚙️ Admin</a><a id="navOrders" class="text-xs bg-sky-600 px-3 py-2 rounded">📦 Order Aktif</a></div></div></header><main class="max-w-7xl mx-auto p-4 md:p-6"><section class="bg-white border rounded-xl p-4 mb-5"><div class="grid md:grid-cols-4 gap-3"><input id="search" placeholder="Cari nama, order, atau HP..." class="px-3 py-2 text-sm border rounded-lg md:col-span-2"><input id="dateFrom" type="date" class="px-3 py-2 text-sm border rounded-lg"><input id="dateTo" type="date" class="px-3 py-2 text-sm border rounded-lg"></div><div class="flex gap-2 mt-3"><select id="status" class="px-3 py-2 text-sm border rounded-lg"><option value="">Semua riwayat</option><option value="completed">Selesai</option><option value="cancelled">Dibatalkan</option></select><button onclick="refreshHistory()" class="bg-slate-100 px-4 py-2 rounded-lg text-sm">↻ Refresh</button></div></section><section class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-5"><div class="bg-white border rounded-xl p-4"><p class="text-xs text-slate-500">Transaksi</p><b id="count" class="text-2xl">0</b></div><div class="bg-white border rounded-xl p-4"><p class="text-xs text-slate-500">Total Transaksi</p><b id="revenue" class="text-xl text-emerald-600">Rp 0</b></div><div class="bg-white border rounded-xl p-4"><p class="text-xs text-slate-500">Selesai</p><b id="completed" class="text-2xl text-purple-600">0</b></div></section><section class="bg-white border rounded-xl overflow-hidden"><div class="p-4 border-b"><h2 class="font-bold">Transaksi Selesai & Dibatalkan</h2><p class="text-xs text-slate-500">Riwayat sekarang membaca langsung dari Supabase.</p></div><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="bg-slate-900 text-slate-200 text-xs"><th class="p-3">Tanggal</th><th class="p-3">Order</th><th class="p-3">Customer</th><th class="p-3">Layanan</th><th class="p-3">Status</th><th class="p-3">Total</th><th class="p-3">Aksi</th></tr></thead><tbody id="body" class="divide-y"></tbody></table></div><div id="empty" class="hidden py-12 text-center text-slate-400">Belum ada transaksi yang cocok.</div></section></main><script type="module">import{supabase}from'./auth.js';const tenantCode=new URLSearchParams(location.search).get('id')||'demo-asosiasi';let tenant=null,orders=[];const label={completed:'Selesai',cancelled:'Dibatalkan'},esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));const idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});async function bootTenant(){const{data,error}=await supabase.from('tenants').select('id,tenant_code,business_name').eq('tenant_code',tenantCode).maybeSingle();if(error||!data)throw Error('Tenant tidak ditemukan');tenant=data;document.getElementById('tenantLabel').textContent=`${tenant.business_name} • ${tenant.tenant_code}`;document.getElementById('navAdmin').href=`admin.html?id=${encodeURIComponent(tenantCode)}`;document.getElementById('navOrders').href=`orders.html?id=${encodeURIComponent(tenantCode)}`}async function refreshHistory(){const{data,error}=await supabase.from('jfs_orders').select('id,external_id,status,total_amount,notes,created_at,updated_at').eq('tenant_id',tenant.id).in('status',['completed','cancelled']).order('created_at',{ascending:false});if(error)throw error;orders=data||[];render()}function meta(o){try{return JSON.parse(o.notes||'{}')}catch{return{}}}function render(){const q=document.getElementById('search').value.trim().toLowerCase(),from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value,s=document.getElementById('status').value;const rows=orders.filter(o=>{const m=meta(o),text=`${o.external_id||''} ${m.name||''} ${m.phone||''} ${m.service||''}`.toLowerCase();if(q&&!text.includes(q))return false;if(s&&o.status!==s)return false;const d=new Date(o.created_at);if(from&&d<new Date(`${from}T00:00:00`))return false;if(to&&d>new Date(`${to}T23:59:59`))return false;return true});document.getElementById('count').textContent=rows.length;document.getElementById('revenue').textContent=idr(rows.filter(o=>o.status==='completed').reduce((sum,o)=>sum+Number(o.total_amount||0),0));document.getElementById('completed').textContent=rows.filter(o=>o.status==='completed').length;const body=document.getElementById('body');body.innerHTML='';document.getElementById('empty').classList.toggle('hidden',rows.length>0);rows.forEach(o=>{const m=meta(o),st=label[o.status]||o.status;const tr=document.createElement('tr');tr.innerHTML=`<td class="p-3 text-xs text-slate-500">${esc(new Date(o.created_at).toLocaleString('id-ID'))}</td><td class="p-3 font-bold">${esc(o.external_id||o.id)}</td><td class="p-3"><b>${esc(m.name||'-')}</b><div class="text-xs text-slate-500">${esc(m.phone||'-')}</div></td><td class="p-3 text-xs">${esc(m.service||'-')}<div class="text-slate-500">${esc((m.quantity||'-')+' '+(m.unit||''))}</div></td><td class="p-3"><span class="px-2 py-1 rounded-full text-[10px] ${o.status==='completed'?'bg-emerald-100 text-emerald-800':'bg-red-100 text-red-800'}">${esc(st)}</span></td><td class="p-3 font-bold">${idr(o.total_amount)}</td><td class="p-3"><button onclick="viewDetail('${esc(o.id)}')" class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1.5 rounded">👁️ Detail</button></td>`;body.appendChild(tr)})}window.viewDetail=id=>{const o=orders.find(x=>x.id===id);if(!o)return;const m=meta(o);alert(`Order ${o.external_id||o.id}\n\nCustomer: ${m.name||'-'}\nNo. HP: ${m.phone||'-'}\nLayanan: ${m.service||'-'}\nJumlah: ${m.quantity||'-'} ${m.unit||''}\nAlamat: ${m.address||'-'}\nStatus: ${label[o.status]||o.status}\nTotal: ${idr(o.total_amount)}`)}window.refreshHistory=()=>refreshHistory().catch(e=>alert(e.message));['search','dateFrom','dateTo','status'].forEach(id=>document.getElementById(id).addEventListener('input',render));bootTenant().then(refreshHistory).catch(e=>document.getElementById('body').innerHTML=`<tr><td colspan="7" class="p-8 text-center text-red-500">${esc(e.message)}</td></tr>`);setInterval(()=>refreshHistory().catch(console.error),10000);</script></body></html>
