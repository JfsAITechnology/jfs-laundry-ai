<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Riwayat Order — JFS Laundry AI</title><script src="supabase-config.js?v=20260914-8"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#1e293b}.wrap{max-width:1100px;margin:auto;padding:20px}.top{background:#0f172a;color:#fff;padding:14px}.topin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,button{border:0;border-radius:8px;padding:8px 10px;text-decoration:none;background:#1e293b;color:#fff;cursor:pointer;font-size:12px}.nav a.blue{background:#0284c7}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.filters2{display:flex;gap:8px;margin-top:10px}.input,.select{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.stat b{display:block;font-size:22px;margin-top:5px}.muted{font-size:11px;color:#64748b}.tablewrap{overflow:auto}.err{display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:12px;border-radius:10px;margin:12px 0}@media(max-width:700px){.topin{flex-direction:column;align-items:flex-start}.filters{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}table{min-width:800px}}</style></head><body><header class="top"><div class="topin"><div><b>📋 Riwayat Order</b><div id="tenantLabel" class="muted" style="color:#38bdf8">Memuat...</div></div><nav class="nav"><a id="navAdmin" href="#">⚙️ Admin</a><a id="navOrders" class="blue" href="#">📦 Order Aktif</a></nav></div></header><main class="wrap"><section class="card"><div class="filters"><input id="search" class="input" placeholder="Cari nama, order, atau HP..."><input id="dateFrom" class="input" type="date"><input id="dateTo" class="input" type="date"></div><div class="filters2"><select id="status" class="select" style="max-width:220px"><option value="">Semua riwayat</option><option value="completed">Selesai</option><option value="cancelled">Dibatalkan</option></select><button id="refreshBtn">↻ Refresh</button></div></section><div id="error" class="err"></div><section class="stats"><div class="card stat"><span class="muted">Transaksi</span><b id="count">0</b></div><div class="card stat"><span class="muted">Total Transaksi Selesai</span><b id="revenue">Rp 0</b></div><div class="card stat"><span class="muted">Selesai</span><b id="completed">0</b></div></section><section class="card tablewrap"><table style="width:100%;border-collapse:collapse;min-width:800px"><thead><tr style="background:#0f172a;color:#fff"><th style="padding:10px;text-align:left">Tanggal</th><th style="padding:10px;text-align:left">Order</th><th style="padding:10px;text-align:left">Customer</th><th style="padding:10px;text-align:left">Layanan</th><th style="padding:10px;text-align:left">Status</th><th style="padding:10px;text-align:left">Total</th><th style="padding:10px;text-align:left">Aksi</th></tr></thead><tbody id="body"></tbody></table><div id="empty" style="display:none;padding:30px;text-align:center;color:#94a3b8">Belum ada transaksi yang cocok.</div></section></main><script type="module">
import { supabase, requireTenantRole, redirectToLogin } from './auth.js';
const tenantCode=new URLSearchParams(location.search).get('id')||'JFS-LAUNDRY-DEMO-001';
const demoIds=new Set(['JFS-LAUNDRY-DEMO-001','JFS-DEMO-LAUNDRY','demo-asosiasi']);
let tenant=null,orders=[];
const labels={completed:'Selesai',cancelled:'Dibatalkan'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});
const meta=o=>{try{return JSON.parse(o.notes||'{}')}catch{return{}}};
function showError(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}
async function guard(){if(demoIds.has(tenantCode))return true;const r=await requireTenantRole(tenantCode,['owner','admin'],{allowDemo:false});if(r.mode==='login'){redirectToLogin(location.href);return false}if(r.mode==='forbidden'){showError('Akses ditolak untuk tenant ini.');return false}return true}
async function bootTenant(){let r=await supabase.from('tenants').select('id,tenant_code,business_name').eq('tenant_code',tenantCode).maybeSingle();if(!r.data&&/^[0-9a-f-]{36}$/i.test(tenantCode))r=await supabase.from('tenants').select('id,tenant_code,business_name').eq('id',tenantCode).maybeSingle();if(r.error||!r.data)throw Error('Tenant tidak ditemukan');tenant=r.data;document.getElementById('tenantLabel').textContent=`${tenant.business_name||'JFS Laundry AI'} • ${tenant.tenant_code}`;document.getElementById('navAdmin').href=`admin.html?id=${encodeURIComponent(tenant.tenant_code)}`;document.getElementById('navOrders').href=`orders.html?id=${encodeURIComponent(tenant.tenant_code)}`}
async function refreshHistory(){const b=document.getElementById('refreshBtn');b.disabled=true;b.textContent='↻ Memuat...';try{await bootTenant();const r=await supabase.from('jfs_orders').select('id,external_id,status,total_amount,notes,created_at,updated_at').eq('tenant_id',tenant.id).in('status',['completed','cancelled']).order('created_at',{ascending:false});if(r.error)throw r.error;orders=r.data||[];render();document.getElementById('error').style.display='none'}catch(e){showError(e?.message||'Gagal memuat riwayat');document.getElementById('body').innerHTML='<tr><td colspan="7" style="padding:30px;text-align:center;color:#b91c1c">Riwayat gagal dimuat.</td></tr>'}finally{b.disabled=false;b.textContent='↻ Refresh'}}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value,s=document.getElementById('status').value;const rows=orders.filter(o=>{const m=meta(o),text=`${o.external_id||''} ${m.name||''} ${m.phone||''} ${m.service||''}`.toLowerCase();if(q&&!text.includes(q))return false;if(s&&o.status!==s)return false;const d=new Date(o.created_at);if(from&&d<new Date(`${from}T00:00:00`))return false;if(to&&d>new Date(`${to}T23:59:59`))return false;return true});document.getElementById('count').textContent=rows.length;document.getElementById('revenue').textContent=idr(rows.filter(o=>o.status==='completed').reduce((sum,o)=>sum+Number(o.total_amount||0),0));document.getElementById('completed').textContent=rows.filter(o=>o.status==='completed').length;const body=document.getElementById('body');body.innerHTML='';document.getElementById('empty').style.display=rows.length?'none':'block';rows.forEach(o=>{const m=meta(o),tr=document.createElement('tr');tr.innerHTML=`<td style="padding:10px;border-top:1px solid #e2e8f0;font-size:12px">${esc(new Date(o.created_at).toLocaleString('id-ID'))}</td><td style="padding:10px;border-top:1px solid #e2e8f0;font-weight:700">${esc(o.external_id||o.id)}</td><td style="padding:10px;border-top:1px solid #e2e8f0"><b>${esc(m.name||'-')}</b><div class="muted">${esc(m.phone||'-')}</div></td><td style="padding:10px;border-top:1px solid #e2e8f0">${esc(m.service||'-')}<div class="muted">${esc((m.quantity||'-')+' '+(m.unit||''))}</div></td><td style="padding:10px;border-top:1px solid #e2e8f0">${esc(labels[o.status]||o.status)}</td><td style="padding:10px;border-top:1px solid #e2e8f0;font-weight:700">${idr(o.total_amount)}</td><td style="padding:10px;border-top:1px solid #e2e8f0"><button type="button" data-detail="${esc(o.id)}" style="background:#e2e8f0;color:#0f172a">👁️ Detail</button></td>`;body.appendChild(tr)})}
function detail(id){const o=orders.find(x=>x.id===id);if(!o)return;const m=meta(o);alert(`Order ${o.external_id||o.id}\n\nCustomer: ${m.name||'-'}\nNo. HP: ${m.phone||'-'}\nLayanan: ${m.service||'-'}\nJumlah: ${m.quantity||'-'} ${m.unit||''}\nAlamat: ${m.address||'-'}\nStatus: ${labels[o.status]||o.status}\nTotal: ${idr(o.total_amount)}`)}
document.getElementById('refreshBtn').addEventListener('click',refreshHistory);document.getElementById('body').addEventListener('click',e=>{const id=e.target.closest('[data-detail]')?.dataset.detail;if(id)detail(id)});['search','dateFrom','dateTo','status'].forEach(id=>document.getElementById(id).addEventListener('input',render));if(await guard())await refreshHistory();setInterval(()=>refreshHistory(),15000);
</script></body></html>
