<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lacak Pesanan — JFS Laundry AI</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">
<main class="max-w-md mx-auto mt-6">
<header class="flex items-center gap-3 mb-5"><div class="w-11 h-11 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-xl">🧺</div><div><h1 id="storeName" class="font-bold">JFS Laundry AI</h1><p class="text-xs text-slate-400">Lacak status pesanan Anda</p></div></header>
<section class="bg-slate-900 border border-slate-700 rounded-2xl p-4 shadow-xl">
<h2 class="font-bold mb-1">📦 Lacak Pesanan</h2><p class="text-xs text-slate-400 mb-4">Masukkan nomor order yang Anda terima setelah pemesanan.</p>
<div class="flex gap-2"><input id="orderId" placeholder="Contoh: ORD-123456" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm uppercase"><button onclick="track()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-bold">Lacak</button></div>
<div id="result" class="mt-4"></div>
</section>
<a id="back" class="block text-center text-xs text-slate-400 hover:text-white mt-4">← Kembali ke Portal Laundry</a>
</main>
<script>
const params=new URLSearchParams(location.search),tenantId=params.get('id')||'demo-asosiasi',KEY=`jfs_orders_${tenantId}`;
function readOrders(){try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(d)?d:[]}catch(e){return []}}
function idr(n){return Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0})}
function esc(v){return String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function getConfig(){try{return JSON.parse(localStorage.getItem(`tenant_cfg_${tenantId}`)||'{}')}catch(e){return {}}}
function render(o){const steps=['Menunggu Jemput','Dalam Proses','Siap Diambil','Selesai'],idx=Math.max(0,steps.indexOf(o.status));document.getElementById('result').innerHTML=`<div class="bg-slate-950 border border-slate-700 rounded-xl p-4"><div class="flex justify-between items-start gap-3"><div><p class="text-[10px] text-slate-500 uppercase">Nomor Order</p><b class="text-lg">${esc(o.id)}</b><p class="text-xs text-slate-400 mt-1">${esc(o.name||'Customer')}</p></div><span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${idx===3?'bg-emerald-500/15 text-emerald-300':idx===2?'bg-purple-500/15 text-purple-300':idx===1?'bg-blue-500/15 text-blue-300':'bg-amber-500/15 text-amber-300'}">${esc(o.status||'-')}</span></div><div class="mt-5 space-y-3">${steps.map((s,i)=>`<div class="flex items-center gap-3"><div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${i<=idx?'bg-blue-600 text-white':'bg-slate-800 text-slate-500 border border-slate-700'}">${i<=idx?'✓':i+1}</div><div class="flex-1"><p class="text-xs ${i<=idx?'text-white font-semibold':'text-slate-500'}">${s}</p></div></div>`).join('')}</div><div class="mt-5 pt-4 border-t border-slate-800 grid grid-cols-2 gap-3 text-xs"><div><span class="text-slate-500">Layanan</span><p class="font-semibold mt-1">${esc(o.service||'-')}</p></div><div><span class="text-slate-500">Jumlah</span><p class="font-semibold mt-1">${esc(o.weight||'-')}</p></div><div><span class="text-slate-500">Cara</span><p class="font-semibold mt-1">${o.delivery==='dropoff'?'Antar Sendiri':'Jemput Cucian'}</p></div><div><span class="text-slate-500">Estimasi</span><p class="font-semibold mt-1">${idr(o.total)}</p></div></div></div>`}
function track(){const id=document.getElementById('orderId').value.trim().toUpperCase(),o=readOrders().find(x=>String(x.id).toUpperCase()===id);document.getElementById('result').innerHTML=o?'':`<div class="bg-rose-950/30 border border-rose-800/50 text-rose-300 rounded-xl p-3 text-xs">Order tidak ditemukan di demo ini. Pastikan nomor order benar.</div>`;if(o)render(o)}
document.getElementById('back').href=`index.html?id=${encodeURIComponent(tenantId)}`;const cfg=getConfig();if(cfg.name)document.getElementById('storeName').innerText=cfg.name;const q=params.get('order');if(q){document.getElementById('orderId').value=q;track()}document.getElementById('orderId').addEventListener('keydown',e=>{if(e.key==='Enter')track()});window.addEventListener('storage',()=>{if(document.getElementById('orderId').value)track()});setInterval(()=>{if(document.getElementById('orderId').value)track()},3000);
</script></body></html>
