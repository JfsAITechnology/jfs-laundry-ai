<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lacak Pesanan — JFS Laundry AI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="customer-db.js"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen p-4"><main class="max-w-md mx-auto mt-6"><header class="flex items-center gap-3 mb-5"><img src="logo-jfs.png" class="w-11 h-11 rounded-xl bg-white p-1 object-contain"><div><h1 id="storeName" class="font-bold">JFS Laundry AI</h1><p class="text-xs text-slate-400">Lacak status pesanan Anda</p></div></header><section class="bg-slate-900 border border-slate-700 rounded-2xl p-4 shadow-xl"><h2 class="font-bold mb-1">📦 Lacak Pesanan</h2><p class="text-xs text-slate-400 mb-4">Masukkan nomor order yang Anda terima.</p><div class="flex gap-2"><input id="orderId" placeholder="ORD-..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm uppercase"><button onclick="track()" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold">Lacak</button></div><div id="result" class="mt-4"></div></section><a id="back" class="block text-center text-xs text-slate-400 hover:text-white mt-4">← Kembali ke Portal Laundry</a></main><script>const params=new URLSearchParams(location.search),tenantId=params.get('id')||'FIBO-LAUNDRY';function esc(v){return String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function idr(n){return Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0})}function statusLabel(s){return({pending:'Menunggu Jemput',processing:'Dalam Proses',ready:'Siap Diambil',completed:'Selesai',cancelled:'Dibatalkan'})[s]||s||'Menunggu Jemput'}function paymentLabel(s){return({unpaid:'Belum Dibayar',pending:'Menunggu Pembayaran',paid:'Sudah Dibayar',failed:'Pembayaran Gagal',refunded:'Dana Dikembalikan'})[s]||s||'Belum Dibayar'}function render(o){const steps=['pending','processing','ready','completed'],idx=Math.max(0,steps.indexOf(o.status)),meta=(()=>{try{return JSON.parse(o.notes||'{}')}catch(e){return {}}})();const payClass=o.payment_status==='paid'?'bg-emerald-500/15 text-emerald-300':'bg-amber-500/15 text-amber-300';document.getElementById('result').innerHTML=`<div class="bg-slate-950 border border-slate-700 rounded-xl p-4"><div class="flex justify-between gap-3"><div><p class="text-[10px] text-slate-500 uppercase">Nomor Order</p><b class="text-lg">${esc(o.external_id)}</b><p class="text-xs text-slate-400 mt-1">${esc(meta.name||'Customer')}</p></div><span class="px-2.5 py-1 h-fit rounded-full bg-blue-500/15 text-blue-300 text-[10px] font-bold">${esc(statusLabel(o.status))}</span></div><div class="mt-5 space-y-3">${steps.map((s,i)=>`<div class="flex items-center gap-3"><div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${i<=idx?'bg-blue-600':'bg-slate-800 text-slate-500 border border-slate-700'}">${i<=idx?'✓':i+1}</div><p class="text-xs ${i<=idx?'text-white font-semibold':'text-slate-500'}">${statusLabel(s)}</p></div>`).join('')}</div><div class="mt-5 pt-4 border-t border-slate-800 grid grid-cols-2 gap-3 text-xs"><div><span class="text-slate-500">Layanan</span><p class="font-semibold mt-1">${esc(meta.service||'-')}</p></div><div><span class="text-slate-500">Jumlah</span><p class="font-semibold mt-1">${esc((meta.quantity||'-')+' '+(meta.unit||''))}</p></div><div><span class="text-slate-500">Cara</span><p class="font-semibold mt-1">${meta.delivery==='dropoff'?'Antar Sendiri':'Jemput Cucian'}</p></div><div><span class="text-slate-500">Total</span><p class="font-semibold mt-1">${idr(o.total_amount)}</p></div></div><div class="mt-4 pt-4 border-t border-slate-800"><div class="flex justify-between items-center"><span class="text-xs text-slate-500">Pembayaran</span><span class="px-2 py-1 rounded-full text-[10px] font-bold ${payClass}">${esc(paymentLabel(o.payment_status))}</span></div><p class="text-[10px] text-slate-500 mt-1">Metode: ${esc(o.payment_method||'Bayar di toko')}</p></div></div>`}async function track(){const id=document.getElementById('orderId').value.trim().toUpperCase(),box=document.getElementById('result');if(!window.jfsDb){box.innerHTML='<div class="text-rose-300 text-xs">Database belum tersedia.</div>';return}const tenant=(await jfsDb.from('tenants').select('id,business_name').eq('tenant_code',tenantId).maybeSingle()).data;if(!tenant){box.innerHTML='<div class="text-rose-300 text-xs">Tenant tidak ditemukan.</div>';return}document.getElementById('storeName').textContent=tenant.business_name||'JFS Laundry AI';const{data,error}=await jfsDb.from('jfs_orders').select('external_id,status,total_amount,payment_status,payment_method,notes,created_at,updated_at').eq('tenant_id',tenant.id).eq('external_id',id).maybeSingle();if(error||!data){box.innerHTML='<div class="bg-rose-950/30 border border-rose-800/50 text-rose-300 rounded-xl p-3 text-xs">Order tidak ditemukan. Pastikan nomor order benar.</div>';return}render(data)}document.getElementById('back').href=`index.html?id=${encodeURIComponent(tenantId)}`;const q=params.get('order');if(q){document.getElementById('orderId').value=q;track()}document.getElementById('orderId').addEventListener('keydown',e=>{if(e.key==='Enter')track()});setInterval(()=>{if(document.getElementById('orderId').value)track()},5000);</script></body></html>
