<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lacak Pesanan — JFS Laundry AI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="customer-db.js"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen p-4"><main class="max-w-md mx-auto mt-6"><header class="flex items-center gap-3 mb-5"><img src="logo-jfs.png" class="w-11 h-11 rounded-xl bg-white p-1"><div><h1 id="storeName" class="font-bold">JFS Laundry AI</h1><p class="text-xs text-slate-400">Status pesanan Anda</p></div></header><section class="bg-slate-900 border border-slate-700 rounded-2xl p-4"><div class="flex gap-2"><input id="orderId" placeholder="ORD-..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm uppercase"><button onclick="track()" class="bg-blue-600 px-4 rounded-lg text-sm font-bold">Lacak</button></div><div id="result" class="mt-4"></div></section><a id="back" class="block text-center text-xs text-slate-400 mt-4">← Kembali ke Portal Laundry</a></main><script>const params=new URLSearchParams(location.search),tenantCode=params.get('id')||'FIBO-LAUNDRY';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});const label={pending:'Menunggu Jemput',processing:'Dalam Proses',ready:'Siap Diambil',completed:'Selesai',cancelled:'Dibatalkan'};const payment={unpaid:'Belum Dibayar',pending:'Menunggu Pembayaran',paid:'Sudah Dibayar',failed:'Pembayaran Gagal',refunded:'Dana Dikembalikan'};async function track(){const id=document.getElementById('orderId').value.trim().toUpperCase(),box=document.getElementById('result');if(!window.jfsDb){box.innerHTML='<p class="text-red-300 text-xs">Database belum tersedia.</p>';return}const{data:t}=await jfsDb.from('tenants').select('id,business_name').eq('tenant_code',tenantCode).maybeSingle();if(!t){box.innerHTML='<p class="text-red-300 text-xs">Tenant tidak ditemukan.</p>';return}document.getElementById('storeName').textContent=t.business_name||'JFS Laundry AI';const{data:o}=await jfsDb.from('jfs_orders').select('id,external_id,status,total_amount,payment_status,payment_method,notes,created_at,updated_at').eq('tenant_id',t.id).eq('external_id',id).maybeSingle();if(!o){box.innerHTML='<div class="bg-red-950/30 border border-red-800 rounded-xl p-3 text-xs text-red-300">Order tidak ditemukan.</div>';return}let m={};try{m=JSON.parse(o.notes||'{}')}catch{}const{data:h}=await jfsDb.from('jfs_order_status_history').select('from_status,to_status,note,created_at').eq('order_id',o.id).order('created_at',{ascending:false}).limit(10);const{data:n}=await jfsDb.from('jfs_order_notifications').select('title,message,created_at').eq('order_id',o.id).order('created_at',{ascending:false}).limit(5);const history=(h||[]).map(x=>`<div class="border-l-2 border-blue-500 pl-3 py-1"><b class="text-xs">${esc(label[x.to_status]||x.to_status)}</b><p class="text-[10px] text-slate-500">${new Date(x.created_at).toLocaleString('id-ID')}</p>${x.note?`<p class="text-[10px] text-slate-400">${esc(x.note)}</p>`:''}</div>`).join('');const notes=(n||[]).map(x=>`<div class="bg-blue-950/30 border border-blue-500/20 rounded-lg p-2"><b class="text-[10px]">${esc(x.title)}</b><p class="text-[10px] text-slate-300 mt-1">${esc(x.message)}</p></div>`).join('');box.innerHTML=`<div class="bg-slate-950 border border-slate-700 rounded-xl p-4"><div class="flex justify-between"><div><p class="text-[10px] text-slate-500">Nomor Order</p><b class="text-lg">${esc(o.external_id)}</b><p class="text-xs text-slate-400">${esc(m.name||'Customer')}</p></div><span class="px-2 py-1 h-fit rounded-full bg-blue-500/15 text-blue-300 text-[10px] font-bold">${esc(label[o.status]||o.status)}</span></div><div class="mt-4 grid grid-cols-2 gap-3 text-xs"><div><span class="text-slate-500">Layanan</span><p>${esc(m.service||'-')}</p></div><div><span class="text-slate-500">Jumlah</span><p>${esc((m.quantity||'-')+' '+(m.unit||''))}</p></div><div><span class="text-slate-500">Cara</span><p>${m.delivery==='dropoff'?'Antar Sendiri':'Jemput Cucian'}</p></div><div><span class="text-slate-500">Total</span><p class="font-bold">${idr(o.total_amount)}</p></div></div><div class="mt-4 border-t border-slate-800 pt-3"><div class="flex justify-between"><span class="text-xs text-slate-500">Pembayaran</span><b class="text-xs ${o.payment_status==='paid'?'text-emerald-300':'text-amber-300'}">${esc(payment[o.payment_status]||o.payment_status)}</b></div><p class="text-[10px] text-slate-500">${esc(o.payment_method||'Bayar di toko')}</p></div>${history?`<div class="mt-4 border-t border-slate-800 pt-3"><h3 class="text-xs font-bold mb-2">Riwayat Status</h3><div class="space-y-2">${history}</div></div>`:''}${notes?`<div class="mt-4 border-t border-slate-800 pt-3"><h3 class="text-xs font-bold mb-2">🔔 Pemberitahuan</h3><div class="space-y-2">${notes}</div></div>`:''}</div>`}document.getElementById('back').href=`index.html?id=${encodeURIComponent(tenantCode)}`;const q=params.get('order');if(q){document.getElementById('orderId').value=q;track()}document.getElementById('orderId').addEventListener('keydown',e=>{if(e.key==='Enter')track()});setInterval(()=>{if(document.getElementById('orderId').value)track()},5000);</script></body></html>
