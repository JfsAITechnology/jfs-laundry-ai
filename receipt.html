<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Receipt — JFS Laundry AI</title><style>
:root{--bg:#0D1117;--card:#161b22;--line:#30363d;--text:#f0f6fc;--muted:#8b949e;--blue:#2563eb;--cyan:#22d3ee;--green:#22c55e;--amber:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0D1117,#090c10);color:var(--text);font:14px Inter,Arial,sans-serif;padding:18px}.wrap{max-width:520px;margin:auto}.brand{display:flex;align-items:center;gap:12px;margin:6px 0 18px}.brand img{width:46px;height:46px;border-radius:12px;background:#fff;padding:4px}.brand h1{font-size:18px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 14px 40px #0006}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.12em}.order{font-size:20px;font-weight:800;margin-top:4px}.badge{padding:7px 10px;border-radius:999px;background:#2563eb22;color:#60a5fa;font-weight:800;font-size:11px;white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.item{background:#0d1117;border:1px solid #21262d;border-radius:14px;padding:12px}.label{font-size:10px;color:var(--muted)}.value{font-weight:700;margin-top:4px;word-break:break-word}.total{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}.total b{font-size:22px;color:var(--cyan)}.payment{margin-top:14px;padding:12px;border-radius:14px;background:#f59e0b14;border:1px solid #f59e0b44}.payment.paid{background:#22c55e12;border-color:#22c55e44}.history{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.history-row{padding:9px 0;border-bottom:1px solid #21262d}.history-row:last-child{border:0}.actions{display:grid;gap:10px;margin-top:18px}.btn{display:block;text-align:center;text-decoration:none;border-radius:13px;padding:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7c3aed,#2563eb)}.btn.wa{background:#16a34a}.btn.secondary{background:#21262d;border:1px solid var(--line)}.foot{text-align:center;color:var(--muted);font-size:11px;margin:16px}.error{color:#fca5a5;background:#450a0a55;border:1px solid #7f1d1d;padding:12px;border-radius:12px}.live{color:var(--cyan);font-size:11px;margin-top:10px}
</style></head><body><main class="wrap"><header class="brand"><img src="logo-jfs.png"><div><h1 id="store">JFS Laundry AI</h1><p>Powered by JFS AI Technology</p></div></header><section class="card"><div id="loading">Memuat E-Receipt...</div><div id="receipt" hidden></div></section><p class="foot">E-Receipt resmi • Data berasal dari sistem JFS Laundry AI</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="customer-db.js"></script>
<script>
const p=new URLSearchParams(location.search),tenant= p.get('id')||'JFS-LAUNDRY-DEMO-001',order=p.get('order'),token=p.get('token'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});
const status={pending:'Menunggu Jemput',processing:'Dalam Proses',ready:'Siap Diambil',completed:'Selesai',cancelled:'Dibatalkan'},pay={unpaid:'BELUM DIBAYAR',pending:'MENUNGGU PEMBAYARAN',paid:'LUNAS',failed:'PEMBAYARAN GAGAL',refunded:'DIKEMBALIKAN'};
function meta(o){try{return JSON.parse(o.notes||'{}')}catch{return{}}}
async function load(){
 const box=document.getElementById('receipt');
 if(!order||!token||!window.jfsDb){document.getElementById('loading').innerHTML='<div class="error">Link E-Receipt tidak lengkap atau database belum tersedia.</div>';return}
 const {data,error}=await jfsDb.rpc('jfs_track_customer_order',{p_tenant_code:tenant,p_external_id:order,p_tracking_token:token});
 if(error||!data){document.getElementById('loading').innerHTML='<div class="error">E-Receipt tidak ditemukan atau kode akses tidak cocok.</div>';return}
 document.getElementById('loading').hidden=true;box.hidden=false;document.getElementById('store').textContent=data.business_name||'JFS Laundry AI';
 const m=meta(data),wa=String(data.whatsapp||'').replace(/\D/g,'').replace(/^0/,'62');
 const msg=encodeURIComponent('Halo Admin, saya customer order '+data.external_id+'. Saya sudah melakukan transfer dan akan mengirim bukti pembayaran.');
 const history=(data.history||[]).map(x=>'<div class="history-row"><b>'+esc(status[x.to_status]||x.to_status)+'</b><div class="label">'+new Date(x.created_at).toLocaleString('id-ID')+'</div></div>').join('');
 box.innerHTML='<div class="head"><div><div class="eyebrow">E-RECEIPT</div><div class="order">'+esc(data.external_id)+'</div><div class="label">Dibuat '+new Date(data.created_at).toLocaleString('id-ID')+'</div></div><span class="badge">'+esc(status[data.status]||data.status)+'</span></div>'+
 '<div class="grid"><div class="item"><div class="label">CUSTOMER</div><div class="value">'+esc(m.name||'-')+'</div></div><div class="item"><div class="label">WHATSAPP</div><div class="value">'+esc(m.phone||'-')+'</div></div><div class="item"><div class="label">LAYANAN</div><div class="value">'+esc(m.service||'-')+'</div></div><div class="item"><div class="label">JUMLAH</div><div class="value">'+esc((m.quantity||'-')+' '+(m.unit||''))+'</div></div></div>'+
 '<div class="total"><span>Total</span><b>'+idr(data.total_amount)+'</b></div>'+
 '<div class="payment '+(data.payment_status==='paid'?'paid':'')+'"><div class="label">STATUS PEMBAYARAN</div><strong>'+esc(pay[data.payment_status]||data.payment_status)+'</strong><div class="label" style="margin-top:5px">Metode: '+esc(data.payment_method||'-')+'</div></div>'+
 (history?'<div class="history"><div class="label" style="margin-bottom:5px">RIWAYAT STATUS</div>'+history+'</div>':'')+
 '<div class="live">● E-Receipt diperbarui otomatis setiap 5 detik</div>'+
 '<div class="actions"><a class="btn secondary" href="track.html?id='+encodeURIComponent(tenant)+'&order='+encodeURIComponent(data.external_id)+'&token='+encodeURIComponent(data.tracking_token)+'">📦 Lihat Tracking</a>'+
 (data.payment_status!=='paid'&&wa?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+wa+'?text='+msg+'">💬 Kirim Bukti Pembayaran via WA</a>':'')+
 '<a class="btn" href="index.html?id='+encodeURIComponent(tenant)+'&customer=1">🧺 Buat Order Baru</a></div>';
}
load();setInterval(load,5000);
</script></body></html>
