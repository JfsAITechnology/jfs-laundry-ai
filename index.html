<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JFS Laundry AI — Portal Customer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-3 md:p-6 flex justify-center items-center">

  <main class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col h-[92vh]">
    
    <!-- 1. Header Profil Toko -->
    <header class="bg-slate-900 p-4 border-b border-slate-700 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-xl">
          🧺
        </div>
        <div>
          <h1 id="display-store-name" class="font-bold text-sm md:text-base text-white leading-snug">Loading...</h1>
          <p id="display-store-address" class="text-[11px] text-slate-400">Loading...</p>
        </div>
      </div>
      <a id="btn-wa-direct" href="#" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold px-3 py-2 rounded-lg transition shadow-sm">
        💬 WA Toko
      </a>
    </header>

    <!-- Content Scrollable Area -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">

      <!-- 2. Section Daftar Harga Dinamis -->
      <section class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60">
        <h2 class="text-[11px] font-bold text-blue-400 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
          🏷️ Daftar Layanan & Tarif
        </h2>
        <div id="pricelist-container" class="grid grid-cols-2 gap-2 text-xs">
          <!-- Diisi otomatis oleh JS -->
        </div>
      </section>

      <!-- 3. Section Form Order / Minta Jemput Cucian -->
      <section class="bg-blue-950/40 border border-blue-500/30 p-4 rounded-xl space-y-3">
        <div class="flex items-center gap-2 border-b border-blue-500/20 pb-2">
          <span class="text-base">🛵</span>
          <div>
            <h3 class="text-xs font-bold text-white">Pesan & Minta Penjemputan</h3>
            <p class="text-[10px] text-slate-400">Isi form di bawah untuk minta kurir jemput cucian kamu</p>
          </div>
        </div>

        <form onsubmit="sendPickupOrder(event)" class="space-y-2.5 text-xs">
          <div>
            <label class="block text-slate-300 text-[11px] mb-1">Nama Pemesan</label>
            <input type="text" id="order-name" required placeholder="Contoh: Budi Santoso" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500">
          </div>

          <div>
            <label class="block text-slate-300 text-[11px] mb-1">Jenis Layanan</label>
            <select id="order-service" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500">
              <!-- Diisi otomatis oleh JS dari daftar harga -->
            </select>
          </div>

          <div>
            <label class="block text-slate-300 text-[11px] mb-1">Estimasi Jumlah (Kg / Pcs)</label>
            <input type="text" id="order-qty" placeholder="Contoh: 5 Kg / 2 Pasang Sepatu" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500">
          </div>

          <div>
            <label class="block text-slate-300 text-[11px] mb-1">Alamat Lengkap Penjemputan</label>
            <textarea id="order-address" rows="2" required placeholder="Jl. Raya Sidosermo No. 12, Samping Indomaret" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500 resize-none"></textarea>
          </div>

          <div>
            <label class="block text-slate-300 text-[11px] mb-1">Catatan Khusus (Opsional)</label>
            <input type="text" id="order-notes" placeholder="Contoh: Baju putih dipisah / jemput jam 2 siang" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500">
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition shadow-lg flex items-center justify-center gap-2">
            🚀 Kirim Order Penjemputan via WA
          </button>
        </form>
      </section>

      <!-- 4. Area Chatbot AI -->
      <section class="bg-slate-900/40 p-3 rounded-xl border border-slate-700/40 space-y-2">
        <h3 class="text-[11px] font-bold text-slate-400 flex items-center gap-1.5">
          🤖 AI Assistant Laundry
        </h3>
        <div id="chat-box" class="space-y-2 max-h-40 overflow-y-auto pr-1 text-xs">
          <div class="bg-slate-700/60 text-slate-200 p-2.5 rounded-lg max-w-[90%]">
            Halo! 👋 Ada pertanyaan tentang estimasi harga atau jadwal operasional? Tanyakan di bawah ya!
          </div>
        </div>
        <div class="flex gap-2 pt-1">
          <input type="text" id="chat-input" placeholder="Tanya AI harga / estimasi..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
          <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-3 py-1.5 rounded-lg transition">
            Kirim
          </button>
        </div>
      </section>

    </div>
  </main>

  <script>
    let activeConfig = {};

    function loadTenantPortal() {
      // Ambil data tenant aktif dari config.js atau localStorage
      activeConfig = (typeof APP_CONFIG !== 'undefined') ? APP_CONFIG : (typeof getActiveTenantData === 'function' ? getActiveTenantData() : {});

      // Tampilkan Profil Toko
      document.getElementById('display-store-name').innerText = activeConfig.name || "JFS Laundry AI";
      document.getElementById('display-store-address').innerText = activeConfig.address || "Surabaya";
      
      const waNum = activeConfig.waNumber || "6282230010172";
      document.getElementById('btn-wa-direct').href = `https://wa.me/${waNum}?text=Halo%20${encodeURIComponent(activeConfig.name)},%20saya%20ingin%20bertanya.`;

      // Render Pricelist
      const container = document.getElementById('pricelist-container');
      const selectService = document.getElementById('order-service');
      
      container.innerHTML = '';
      selectService.innerHTML = '';

      const pricelist = activeConfig.pricelist || {};
      const keys = Object.keys(pricelist);

      if (keys.length === 0) {
        container.innerHTML = `<p class="col-span-2 text-slate-500 italic">Daftar harga belum diatur oleh admin.</p>`;
        selectService.innerHTML = `<option value="Layanan Umum">Layanan Umum</option>`;
        return;
      }

      keys.forEach(key => {
        // Isi Grid Harga
        const item = document.createElement('div');
        item.className = "bg-slate-900/80 border border-slate-700/50 p-2 rounded-lg flex justify-between items-center";
        item.innerHTML = `
          <span class="font-medium text-slate-300 capitalize">${key}</span>
          <span class="font-bold text-emerald-400">Rp ${Number(pricelist[key]).toLocaleString('id-ID')}</span>
        `;
        container.appendChild(item);

        // Isi Dropdown Pilihan Layanan di Form Penjemputan
        const opt = document.createElement('option');
        opt.value = key.toUpperCase();
        opt.innerText = `${key.toUpperCase()} (Rp ${Number(pricelist[key]).toLocaleString('id-ID')})`;
        selectService.appendChild(opt);
      });
    }

    // Fungsi Kirim Order Penjemputan ke WA Toko
    function sendPickupOrder(e) {
      e.preventDefault();

      const name = document.getElementById('order-name').value.trim();
      const service = document.getElementById('order-service').value;
      const qty = document.getElementById('order-qty').value.trim();
      const address = document.getElementById('order-address').value.trim();
      const notes = document.getElementById('order-notes').value.trim() || '-';

      const waNum = activeConfig.waNumber || "6282230010172";

      const message = `*MINTA PENJEMPUTAN CUCIAN - ${activeConfig.name.toUpperCase()}*%0A%0A` +
        `👤 *Nama*: ${encodeURIComponent(name)}%0A` +
        `🧺 *Layanan*: ${encodeURIComponent(service)}%0A` +
        `⚖️ *Estimasi Jumlah*: ${encodeURIComponent(qty)}%0A` +
        `📍 *Alamat Jemput*: ${encodeURIComponent(address)}%0A` +
        `📝 *Catatan*: ${encodeURIComponent(notes)}%0A%0A` +
        `Mohon segera diproses dan dijemput ya Admin. Terima kasih!`;

      // Buka WA Langsung
      window.open(`https://wa.me/${waNum}?text=${message}`, '_blank');
    }

    // Simulasi Chatbot AI sederhananya
    function function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chat-box');

      // 1. Tampilkan pesan user
      const userBubble = document.createElement('div');
      userBubble.className = "bg-blue-600 text-white p-2 rounded-lg max-w-[85%] ml-auto text-[11px]";
      userBubble.innerText = text;
      chatBox.appendChild(userBubble);

      input.value = '';

      // 2. Logika Pemrosesan AI
      setTimeout(() => {
        const aiBubble = document.createElement('div');
        aiBubble.className = "bg-slate-700/60 text-slate-200 p-2 rounded-lg max-w-[85%] text-[11px]";
        
        const config = activeConfig || {};
        const pricelist = config.pricelist || {};
        const lowerText = text.toLowerCase();
        
        let responseText = "";

        // Ekstrak Angka dari Pesan (contoh: "4 kg" -> 4)
        const extractedNumbers = lowerText.match(/\d+/g);
        const qty = extractedNumbers ? parseInt(extractedNumbers[0]) : null;

        // Cari Jenis Layanan yang Cocok di Pricelist
        let matchedKey = null;
        Object.keys(pricelist).forEach(key => {
          if (lowerText.includes(key.toLowerCase())) {
            matchedKey = key;
          }
        });

        // KASUS A: Ada Jenis Layanan & Ada Angka Berat/Jumlah (Contoh: "express 4 kg")
        if (matchedKey && qty) {
          const unitPrice = pricelist[matchedKey];
          const totalPrice = unitPrice * qty;
          responseText = `Untuk layanan *${matchedKey.toUpperCase()}* sebanyak *${qty} Kg/Pcs*, total estimasinya adalah *Rp ${totalPrice.toLocaleString('id-ID')}* (Rp ${unitPrice.toLocaleString('id-ID')}/unit). Silakan isi form penjemputan di atas ya! 🧺`;
        } 
        // KASUS B: Ada Jenis Layanan Saja (Contoh: "express berapa?")
        else if (matchedKey) {
          const unitPrice = pricelist[matchedKey];
          responseText = `Tarif layanan *${matchedKey.toUpperCase()}* di ${config.name} adalah *Rp ${unitPrice.toLocaleString('id-ID')}* per Kg/Pcs. Berapa Kg yang mau dicuci?`;
        }
        // KASUS C: Menanyakan Harga Secara Umum (Contoh: "berapa harganya?", "daftar tarif")
        else if (lowerText.includes('harga') || lowerText.includes('tarif') || lowerText.includes('berapa')) {
          const listStr = Object.entries(pricelist).map(([k, v]) => `${k.toUpperCase()}: Rp ${v.toLocaleString('id-ID')}`).join(', ');
          responseText = `Berikut daftar tarif di ${config.name}:\n${listStr}.`;
        }
        // KASUS D: Menanyakan Lokasi / Jam Operasional
        else if (lowerText.includes('alamat') || lowerText.includes('lokasi') || lowerText.includes('mana')) {
          responseText = `${config.name} berlokasi di: ${config.address}. Kamu bisa pesan antar-jemput langsung lewat form di atas!`;
        }
        // KASUS E: Pertanyaan Umum
        else {
          responseText = `Halo! Di ${config.name}, kamu bisa cek daftar harga di atas atau pesan layanan antar-jemput secara langsung via formulir. Ada yang ingin ditanyakan lagi?`;
        }

        aiBubble.innerText = responseText;
        chatBox.appendChild(aiBubble);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 400);
    }() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chat-box');

      const userBubble = document.createElement('div');
      userBubble.className = "bg-blue-600 text-white p-2 rounded-lg max-w-[85%] ml-auto text-[11px]";
      userBubble.innerText = text;
      chatBox.appendChild(userBubble);

      input.value = '';

      setTimeout(() => {
        const aiBubble = document.createElement('div');
        aiBubble.className = "bg-slate-700/60 text-slate-200 p-2 rounded-lg max-w-[85%] text-[11px]";
        
        let responseText = `Untuk order penjemputan langsung di ${activeConfig.name}, Anda bisa mengisi formulir penjemputan di atas ya!`;
        
        const lowerText = text.toLowerCase();
        if (lowerText.includes('harga') || lowerText.includes('tarif')) {
          const listStr = Object.entries(activeConfig.pricelist || {}).map(([k, v]) => `${k.toUpperCase()}: Rp ${v}`).join(', ');
          responseText = `Berikut daftar harga di ${activeConfig.name}: ${listStr}.`;
        }

        aiBubble.innerText = responseText;
        chatBox.appendChild(aiBubble);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 500);
    }

    window.addEventListener('DOMContentLoaded', loadTenantPortal);
  </script>
</body>
</html>
