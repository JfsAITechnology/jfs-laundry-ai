<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JFS Laundry AI — Portal Customer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-3 md:p-6 flex justify-center items-center">
<main class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col h-[92vh]">
<header class="bg-slate-900 p-4 border-b border-slate-700 flex items-center justify-between">
  <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-xl">🧺</div><div><h1 id="display-store-name" class="font-bold text-sm md:text-base text-white">Loading...</h1><p id="display-store-address" class="text-[11px] text-slate-400">Loading...</p></div></div>
  <a id="btn-wa-direct" href="#" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold px-3 py-2 rounded-lg">💬 WA Toko</a>
</header>
<div class="flex-1 overflow-y-auto p-4 space-y-4">
<section class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60"><h2 class="text-[11px] font-bold text-blue-400 uppercase tracking-wider mb-2.5">🏷️ Daftar Layanan & Tarif</h2><div id="pricelist-container" class="grid grid-cols-2 gap-2 text-xs"></div></section>
<section class="bg-blue-950/40 border border-blue-500/30 p-4 rounded-xl space-y-3">
<div class="flex items-center gap-2 border-b border-blue-500/20 pb-2"><span>🛵</span><div><h3 class="text-xs font-bold text-white">Pesan & Minta Penjemputan</h3><p class="text-[10px] text-slate-400">Order masuk otomatis ke dashboard laundry.</p></div></div>
<form onsubmit="sendPickupOrder(event)" class="space-y-2.5 text-xs">
<div><label class="block text-slate-300 text-[11px] mb-1">Nama Pemesan</label><input type="text" id="order-name" required placeholder="Contoh: Budi Santoso" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></div>
<div><label class="block text-slate-300 text-[11px] mb-1">Nomor WhatsApp</label><input type="tel" id="order-phone" required placeholder="08xxxxxxxxxx" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></div>
<div><label class="block text-slate-300 text-[11px] mb-1">Jenis Layanan</label><select id="order-service" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></select></div>
<div><label class="block text-slate-300 text-[11px] mb-1">Estimasi Jumlah (Kg / Pcs)</label><input type="text" id="order-qty" required placeholder="5 Kg / 2 Pcs" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></div>
<div><label class="block text-slate-300 text-[11px] mb-1">Alamat Penjemputan</label><textarea id="order-address" rows="2" required placeholder="Alamat lengkap" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white resize-none"></textarea></div>
<div><label class="block text-slate-300 text-[11px] mb-1">Catatan (Opsional)</label><input type="text" id="order-notes" placeholder="Pisahkan baju putih" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white"></div>
<button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg">🚀 Kirim Order via WhatsApp</button>
</form></section>
<section class="bg-slate-900/40 p-3 rounded-xl border border-slate-700/40 space-y-2"><h3 class="text-[11px] font-bold text-slate-400">🤖 JFS Laundry AI Assistant</h3>
<div class="flex flex-wrap gap-1.5"><button onclick="quickAsk('harga')" class="bg-slate-700 px-2 py-1 rounded text-[10px]">Cek Harga</button><button onclick="quickAsk('express')" class="bg-slate-700 px-2 py-1 rounded text-[10px]">Express</button><button onclick="quickAsk('pickup')" class="bg-slate-700 px-2 py-1 rounded text-[10px]">Jemput Cucian</button></div>
<div id="chat-box" class="space-y-2 max-h-56 overflow-y-auto pr-1 text-xs"><div class="bg-slate-700/60 text-slate-200 p-2.5 rounded-lg max-w-[90%]">Halo! 👋 Saya JFS Laundry AI. Tanya harga atau langsung pesan jemput cucian ya.</div></div>
<div class="flex gap-2"><input type="text" id="chat-input" placeholder="Tanya harga / layanan..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"><button onclick="sendMessage()" class="bg-blue-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg">Kirim</button></div></section>
</div></main>
<script>
let activeConfig={};
const urlParams=new URLSearchParams(location.search); const tenantId=urlParams.get('id')||'demo-asosiasi'; const ORDER_KEY=`jfs_orders_${tenantId}`;
function getTenantConfig(){const saved=localStorage.getItem(`tenant_cfg_${tenantId}`);if(saved){try{return JSON.parse(saved)}catch(e){}}return {name:`LAUNDRY ${tenantId.replace(/-/g,' ').toUpperCase()}`,address:'Surabaya',waNumber:'6282230010172',pricelist:{kiloan:7000,setrika:9000,express:15000}}}
function loadTenantPortal(){activeConfig=getTenantConfig();document.getElementById('display-store-name').innerText=activeConfig.name;document.getElementById('display-store-address').innerText=activeConfig.address;const wa=activeConfig.waNumber||'6282230010172';document.getElementById('btn-wa-direct').href=`https://wa.me/${wa}?text=${encodeURIComponent('Halo '+activeConfig.name+', saya ingin bertanya.')}`;const p=activeConfig.pricelist||{};const c=document.getElementById('pricelist-container'),s=document.getElementById('order-service');c.innerHTML='';s.innerHTML='';Object.entries(p).forEach(([k,v])=>{c.insertAdjacentHTML('beforeend',`<div class="bg-slate-900/80 border border-slate-700/50 p-2 rounded-lg flex justify-between"><span class="capitalize">${k}</span><b class="text-emerald-400">Rp ${Number(v).toLocaleString('id-ID')}</b></div>`);s.insertAdjacentHTML('beforeend',`<option value="${k}">${k.toUpperCase()} — Rp ${Number(v).toLocaleString('id-ID')}</option>`)});}
function normalizePhone(v){let p=v.replace(/\D/g,'');if(p.startsWith('0'))p='62'+p.slice(1);if(!p.startsWith('62'))p='62'+p;return p}
function estimateTotal(service,qty){const n=(String(qty).match(/\d+(?:\.\d+)?/)||[])[0];const price=Number((activeConfig.pricelist||{})[service.toLowerCase()]||0);return n&&price?Math.round(Number(n)*price):0}
function saveOrder(order){let orders=[];try{orders=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]');if(!Array.isArray(orders))orders=[]}catch(e){};orders.unshift(order);localStorage.setItem(ORDER_KEY,JSON.stringify(orders));window.dispatchEvent(new StorageEvent('storage',{key:ORDER_KEY,newValue:JSON.stringify(orders)}));}
function sendPickupOrder(e){e.preventDefault();const name=document.getElementById('order-name').value.trim(),phone=normalizePhone(document.getElementById('order-phone').value),service=document.getElementById('order-service').value,qty=document.getElementById('order-qty').value.trim(),address=document.getElementById('order-address').value.trim(),notes=document.getElementById('order-notes').value.trim()||'-';const serviceKey=service.toLowerCase(), total=estimateTotal(serviceKey,qty);const order={id:'ORD-'+Date.now().toString().slice(-6),timestamp:new Date().toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}),name,phone,service,weight:qty,address,total,status:'Menunggu Jemput',notes,tenantId};saveOrder(order);const msg=`*ORDER JFS LAUNDRY AI*\n\n👤 *Nama*: ${name}\n📱 *WA*: ${phone}\n🧺 *Layanan*: ${service}\n⚖️ *Jumlah*: ${qty}\n📍 *Alamat*: ${address}\n💰 *Estimasi*: ${total?`Rp ${total.toLocaleString('id-ID')}`:'Akan dikonfirmasi'}\n📝 *Catatan*: ${notes}\n\nID Order: ${order.id}`;window.open(`https://wa.me/${activeConfig.waNumber}?text=${encodeURIComponent(msg)}`,'_blank');alert('✅ Order tercatat di dashboard laundry dan WhatsApp dibuka.');}
function quickAsk(type){const q=type==='harga'?'harga':type==='express'?'express':'cara jemput';document.getElementById('chat-input').value=q;sendMessage()}
function addBubble(text,user=false){const b=document.createElement('div');b.className=user?'bg-blue-600 text-white p-2 rounded-lg max-w-[85%] ml-auto text-[11px]':'bg-slate-700/60 text-slate-200 p-2 rounded-lg max-w-[90%] text-[11px]';b.innerText=text;const box=document.getElementById('chat-box');box.appendChild(b);box.scrollTop=box.scrollHeight}
function sendMessage(){const input=document.getElementById('chat-input'),text=input.value.trim();if(!text)return;addBubble(text,true);input.value='';const lower=text.toLowerCase(),p=activeConfig.pricelist||{};let response='Saya siap membantu. Tanyakan harga, layanan express, atau cara penjemputan.';const key=Object.keys(p).find(k=>lower.includes(k.toLowerCase()));const num=(lower.match(/\d+(?:\.\d+)?/)||[])[0];if(key&&num){const total=Number(num)*Number(p[key]);response=`Untuk ${key.toUpperCase()} ${num} unit, estimasi ${total.toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0})}. Mau langsung dijemput?`;}else if(key){response=`Tarif ${key.toUpperCase()} adalah Rp ${Number(p[key]).toLocaleString('id-ID')} per unit. Berapa jumlahnya?`;}else if(lower.includes('harga')||lower.includes('tarif')){response=Object.entries(p).map(([k,v])=>`${k.toUpperCase()}: Rp ${Number(v).toLocaleString('id-ID')}`).join(' • ')}else if(lower.includes('jemput'))response='Bisa. Isi form penjemputan di atas; order akan tercatat otomatis dan dilanjutkan ke WhatsApp toko.';setTimeout(()=>addBubble(response),250)}
window.addEventListener('DOMContentLoaded',loadTenantPortal);document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
</script></body></html>
