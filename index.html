<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JFS Laundry AI — Smart Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-emerald-400" id="brand-title">JFS Laundry AI</h1>
      <p class="text-xs text-slate-400 mt-1" id="company-sub">Powered by JFS AI Technology</p>
    </div>

    <!-- Quick Presets -->
    <div class="mb-4 flex flex-wrap gap-2 justify-center">
      <button onclick="quickSelect(6, 'kering')" class="bg-slate-700 hover:bg-slate-600 text-xs py-2 px-3 rounded-lg text-slate-200 border border-slate-600">🧮 6 kg Kiloan</button>
      <button onclick="quickSelect(3, 'express')" class="bg-slate-700 hover:bg-slate-600 text-xs py-2 px-3 rounded-lg text-slate-200 border border-slate-600">⚡ 3 kg Express</button>
      <button onclick="quickSelect(1, 'bedcover')" class="bg-slate-700 hover:bg-slate-600 text-xs py-2 px-3 rounded-lg text-slate-200 border border-slate-600">🛌 1 Bedcover</button>
    </div>

    <!-- Estimator Output -->
    <div class="bg-slate-900 p-4 rounded-xl mb-6 border border-slate-800 text-sm">
      <div class="flex justify-between mb-2">
        <span class="text-slate-400">Layanan:</span>
        <span id="summary-service" class="font-semibold text-slate-200">-</span>
      </div>
      <div class="flex justify-between mb-2">
        <span class="text-slate-400">Estimasi Ongkir:</span>
        <span id="summary-shipping" class="font-semibold text-slate-200">-</span>
      </div>
      <hr class="border-slate-800 my-2">
      <div class="flex justify-between text-base font-bold">
        <span>Total Estimated:</span>
        <span id="summary-total" class="text-emerald-400">Rp 0</span>
      </div>
    </div>

    <!-- WA Button CTA -->
    <button onclick="sendOrderWA()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
      <span>📲 Lanjut Order via WhatsApp</span>
    </button>
  </div>

  <script>
    // System script fallback jika config.js gagal dimuat
    const config = typeof APP_CONFIG !== 'undefined' ? APP_CONFIG : {
      brandName: "JFS Laundry AI",
      whatsappAdmin: "6282230010172",
      pricing: { kering: 6000, express: 15000, bedcover: 35000 },
      shipping: { minKgFree: 5, flatRate: 5000 }
    };

    let currentOrder = { qty: 0, type: '', total: 0, shippingCost: 0 };

    function quickSelect(qty, type) {
      const rate = config.pricing[type] || 6000;
      const subtotal = qty * rate;
      
      // Hitung ongkir berdasarkan minKgFree
      const shippingCost = (type !== 'bedcover' && qty >= config.shipping.minKgFree) ? 0 : config.shipping.flatRate;
      const total = subtotal + shippingCost;

      currentOrder = { qty, type, total, shippingCost };

      document.getElementById('summary-service').innerText = `${qty} ${type === 'bedcover' ? 'pcs' : 'kg'} (${type.toUpperCase()})`;
      document.getElementById('summary-shipping').innerText = shippingCost === 0 ? "GRATIS" : `Rp ${shippingCost.toLocaleString('id-ID')}`;
      document.getElementById('summary-total').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function sendOrderWA() {
      if (!currentOrder.total) {
        alert("Pilih paket simulasi terlebih dahulu!");
        return;
      }
      const text = `Halo Admin ${config.brandName}, saya mau order laundry:%0A- Layanan: ${currentOrder.qty} (${currentOrder.type})%0A- Total Estimasi: Rp ${currentOrder.total.toLocaleString('id-ID')}%0A%0AMohon diproses ya!`;
      window.open(`https://wa.me/${config.whatsappAdmin}?text=${text}`, '_blank');
    }
  </script>
</body>
</html>
