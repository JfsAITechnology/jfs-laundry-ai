<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Admin — JFS Laundry AI</title><script src="https://cdn.tailwindcss.com"></script><script src="supabase-config.js?v=20260915-9"></script><style>body{font-family:system-ui,sans-serif}.card{background:var(--jfs-surface);border:1px solid var(--jfs-border);border-radius:1rem;padding:1rem}.muted{color:var(--jfs-muted)}input{border:1px solid var(--jfs-border);background:var(--jfs-input);color:var(--jfs-text);border-radius:.75rem;padding:.8rem;width:100%}</style></head><body><main class="max-w-5xl mx-auto p-4 md:p-8 space-y-5"><header class="flex items-center justify-between gap-3"><div><div class="text-blue-600 font-extrabold">JFS AI TECHNOLOGY</div><h1 class="text-2xl md:text-3xl font-black">Demo Admin Laundry</h1><p id="business" class="muted mt-1">Memuat...</p></div><button id="refresh" class="px-4 py-2 rounded-xl bg-blue-600 text-white font-bold">Refresh</button></header><section class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="card"><div class="muted text-sm">Pesanan Aktif</div><b id="orders" class="text-3xl">0</b></div><div class="card"><div class="muted text-sm">Omzet Aktif</div><b id="revenue" class="text-2xl">Rp 0</b></div><div class="card"><div class="muted text-sm">Customer</div><b id="customers" class="text-3xl">0</b></div><div class="card"><div class="muted text-sm">Menunggu Jemput</div><b id="pending" class="text-3xl">0</b></div></section><section class="card"><h2 class="text-xl font-black mb-3">📦 Pesanan Terbaru</h2><div id="recent" class="space-y-2"></div></section><section class="card"><h2 class="text-xl font-black mb-1">🏷️ Layanan & Tarif</h2><p class="muted text-sm mb-4">Demo memakai fungsi database baru, terpisah dari RPC lama yang menyebabkan error.</p><div id="products" class="space-y-3"></div><button id="add" class="mt-4 px-4 py-3 rounded-xl bg-blue-600 text-white font-bold">+ Tambah Layanan</button><button id="save" class="mt-4 ml-2 px-4 py-3 rounded-xl bg-emerald-600 text-white font-bold">Simpan Tarif</button></section><p id="status" class="text-sm muted"></p></main><script type="module">import{supabase}from'./auth.js?v=20260915-9';const CODE='JFS-LAUNDRY-DEMO-001';let business=null,products=[];const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;'}[c]));const money=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});async function init(){const r=await supabase.rpc('jfs_get_tenant_context_by_code',{p_tenant_code:CODE});if(r.error)throw r.error;business=r.data?.[0];if(!business)throw Error('Demo tenant tidak ditemukan.');document.getElementById('business').textContent=business.business_name||CODE;await Promise.all([loadProducts(),loadOrders()])}async function loadProducts(){const r=await supabase.rpc('jfs_admin_list_products_v2',{p_tenant_id:business.tenant_id});if(r.error)throw r.error;products=r.data||[];renderProducts()}function renderProducts(){const box=document.getElementById('products');box.innerHTML='';const active=products.filter(p=>p.is_active);(active.length?active:[{}]).forEach(p=>{const row=document.createElement('div');row.className='grid grid-cols-[1fr_150px_auto] gap-2';row.dataset.id=p.id||'';row.innerHTML=`<input class="name" placeholder="Nama layanan" value="${esc(p.name||'')}"><input class="price" type="number" min="1" placeholder="Harga" value="${p.price??''}"><button class="remove px-3 rounded-xl bg-rose-600 text-white font-bold">Hapus</button>`;row.querySelector('.remove').onclick=()=>row.remove();box.appendChild(row)})}async function loadOrders(){const r=await supabase.rpc('jfs_admin_recent_orders',{p_tenant_id:business.tenant_id});if(r.error)throw r.error;const a=(r.data||[]).filter(o=>!['completed','cancelled'].includes(o.status));document.getElementById('orders').textContent=a.length;document.getElementById('revenue').textContent=money(a.reduce((s,o)=>s+Number(o.total_amount||0),0));document.getElementById('pending').textContent=a.filter(o=>o.status==='pending').length;document.getElementById('customers').textContent=new Set(a.map(o=>{try{const m=JSON.parse(o.notes||'{}');return m.phone||m.name}catch{return''}}).filter(Boolean)).size;document.getElementById('recent').innerHTML=a.length?a.slice(0,5).map(o=>`<div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800"><b>${esc(o.external_id||o.id)}</b> — ${money(o.total_amount)} — ${esc(o.status)}</div>`).join(''):'<div class="muted">Belum ada pesanan aktif.</div>'}document.getElementById('add').onclick=()=>{products.push({id:null,name:'',price:null,is_active:true});renderProducts();const rows=[...document.querySelectorAll('#products .name')];rows.at(-1)?.focus()};document.getElementById('save').onclick=async()=>{try{const rows=[...document.querySelectorAll('#products>div')].map(r=>({id:r.dataset.id||null,name:r.querySelector('.name').value.trim(),price:Number(r.querySelector('.price').value)})).filter(x=>x.name&&x.price>0);if(!rows.length)throw Error('Minimal satu layanan dengan harga.');const keep=new Set();for(const x of rows){const r=await supabase.rpc('jfs_admin_upsert_product',{p_tenant_id:business.tenant_id,p_product_id:x.id,p_name:x.name,p_price:x.price});if(r.error)throw r.error;keep.add(String(r.data))}for(const p of products.filter(x=>x.is_active))if(!keep.has(String(p.id))){const r=await supabase.rpc('jfs_admin_deactivate_product',{p_tenant_id:business.tenant_id,p_product_id:p.id});if(r.error)throw r.error}document.getElementById('status').textContent='✅ Tarif tersimpan.';await loadProducts()}catch(e){document.getElementById('status').textContent='❌ '+(e.message||e)}};document.getElementById('refresh').onclick=()=>location.reload();(async()=>{try{await init();document.getElementById('status').textContent='✅ Demo Admin V2 aktif.'}catch(e){document.getElementById('status').textContent='❌ '+(e.message||e)}})();</script></body></html>
