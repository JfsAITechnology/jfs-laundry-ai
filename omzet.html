<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Omzet — JFS Laundry AI</title><script src="supabase-config.js?v=20260914-8"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#1e293b}.top{background:#0f172a;color:#fff;padding:14px}.topin,.wrap{max-width:1100px;margin:auto}.topin{display:flex;justify-content:space-between;gap:12px;align-items:center}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,button{border:0;border-radius:8px;padding:8px 10px;text-decoration:none;background:#1e293b;color:#fff;cursor:pointer;font-size:12px}.nav a.green{background:#059669}.wrap{padding:20px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:15px}.input,.select{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px}.card small{color:#64748b}.card b{display:block;font-size:22px;margin-top:6px}.err{display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:12px;border-radius:10px;margin-bottom:15px}.table{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th{background:#0f172a;color:#fff;text-align:left;padding:10px;font-size:12px}td{padding:10px;border-top:1px solid #e2e8f0;font-size:13px}.muted{font-size:11px;color:#64748b}@media(max-width:700px){.topin{flex-direction:column;align-items:flex-start}.filters,.stats{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="topin"><div><b>📈 Omzet</b><div id="tenantLabel" class="muted" style="color:#38bdf8">Memuat...</div></div><nav class="nav"><a id="navAdmin" href="#">⚙️ Admin</a><a id="navOrders" href="#">📦 Order Aktif</a><a id="navHistory" href="#">📋 Riwayat</a></nav></div></header><main class="wrap"><section class="card"><div class="filters"><input id="dateFrom" class="input" type="date"><input id="dateTo" class="input" type="date"><button id="refreshBtn" class="green">↻ Refresh</button></div></section><div id="error" class="err"></div><section class="stats"><div class="card"><small>Total Omzet</small><b id="total">Rp 0</b></div><div class="card"><small>Transaksi Selesai</small><b id="count">0</b></div><div class="card"><small>Rata-rata Transaksi</small><b id="average">Rp 0</b></div></section><section class="table"><table><thead><tr><th>Tanggal</th><th>Order</th><th>Customer</th><th>Status</th><th>Total</th></tr></thead><tbody id="body"></tbody></table></section></main><script type="module">import{supabase,requireTenantRole,redirectToLogin}from'./auth.js';const tenantCode=new URLSearchParams(location.search).get('id')||'JFS-LAUNDRY-DEMO-001',demoIds=new Set(['JFS-LAUNDRY-DEMO-001','JFS-DEMO-LAUNDRY','demo-asosiasi']);let tenant=null,orders=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}),meta=o=>{try{return JSON.parse(o.notes||'{}')}catch{return{}}};function err(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}async function guard(){if(demoIds.has(tenantCode))return true;const r=await requireTenantRole(tenantCode,['owner','admin'],{allowDemo:false});if(r.mode==='login'){redirectToLogin(location.href);return false}if(r.mode==='forbidden'){err('Akses ditolak untuk tenant ini.');return false}return true}async function resolve(){let r=await supabase.from('tenants').select('id,tenant_code,business_name').eq('tenant_code',tenantCode).maybeSingle();if(!r.data&&/^[0-9a-f-]{36}$/i.test(tenantCode))r=await supabase.from('tenants').select('id,tenant_code,business_name').eq('id',tenantCode).maybeSingle();if(r.error||!r.data)throw Error('Tenant tidak ditemukan');tenant=r.data;document.getElementById('tenantLabel').textContent=`${tenant.business_name||'JFS Laundry AI'} • ${tenant.tenant_code}`;document.getElementById('navAdmin').href=`admin.html?id=${encodeURIComponent(tenant.tenant_code)}`;document.getElementById('navOrders').href=`orders.html?id=${encodeURIComponent(tenant.tenant_code)}`;document.getElementById('navHistory').href=`history.html?id=${encodeURIComponent(tenant.tenant_code)}`}async function refresh(){const b=document.getElementById('refreshBtn');b.disabled=true;b.textContent='↻ Memuat...';try{await resolve();const r=await supabase.from('jfs_orders').select('id,external_id,status,total_amount,notes,created_at').eq('tenant_id',tenant.id).eq('status','completed').order('created_at',{ascending:false});if(r.error)throw r.error;orders=r.data||[];render();document.getElementById('error').style.display='none'}catch(e){err(e?.message||'Gagal memuat omzet');document.getElementById('body').innerHTML='<tr><td colspan="5" style="padding:30px;text-align:center;color:#b91c1c">Omzet gagal dimuat.</td></tr>'}finally{b.disabled=false;b.textContent='↻ Refresh'}}function render(){const from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value;const rows=orders.filter(o=>{const d=new Date(o.created_at);if(from&&d<new Date(`${from}T00:00:00`))return false;if(to&&d>new Date(`${to}T23:59:59`))return false;return true});const total=rows.reduce((s,o)=>s+Number(o.total_amount||0),0);document.getElementById('total').textContent=idr(total);document.getElementById('count').textContent=rows.length;document.getElementById('average').textContent=idr(rows.length?total/rows.length:0);const body=document.getElementById('body');body.innerHTML=rows.length?rows.map(o=>{const m=meta(o);return `<tr><td>${esc(new Date(o.created_at).toLocaleString('id-ID'))}</td><td><b>${esc(o.external_id||o.id)}</b></td><td>${esc(m.name||'-')}<div class="muted">${esc(m.phone||'-')}</div></td><td>Selesai</td><td><b>${idr(o.total_amount)}</b></td></tr>`}).join(''):'<tr><td colspan="5" style="padding:30px;text-align:center;color:#94a3b8">Belum ada transaksi selesai.</td></tr>'}document.getElementById('refreshBtn').addEventListener('click',refresh);['dateFrom','dateTo'].forEach(id=>document.getElementById(id).addEventListener('input',render));if(await guard())await refresh();setInterval(refresh,15000);</script></body></html>
