<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omzet — JFS Laundry AI</title><script src="supabase-config.js?v=20260916-2"></script><style>:root{color-scheme:light}body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#1e293b}.top{background:#0f172a;color:#fff;padding:14px}.wrap{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,button,input{border:0;border-radius:8px;padding:9px 11px}.nav a,button{background:#1e293b;color:#fff;text-decoration:none;cursor:pointer}.nav .active{background:#2563eb!important}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.card,.table{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px}.card b{display:block;font-size:22px;margin-top:6px}.table{margin-top:15px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th{background:#0f172a;color:#fff;text-align:left;padding:10px;font-size:12px}td{padding:10px;border-top:1px solid #e2e8f0;font-size:13px}.muted{font-size:11px;color:#64748b}.err{display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:12px;border-radius:10px;margin-top:12px}.theme{background:#334155!important}.dark{color-scheme:dark}.dark body{background:#020617;color:#f8fafc}.dark .card,.dark .table{background:#0f172a;border-color:#334155}.dark td{border-color:#334155;color:#f8fafc}.dark .muted{color:#cbd5e1}.dark input{background:#020617;color:#fff;border:1px solid #475569}.dark input::placeholder{color:#cbd5e1}.dark .err{background:#450a0a;color:#fecaca;border-color:#7f1d1d}.dark .theme{background:#475569!important;color:#fff!important}@media(max-width:700px){.bar{flex-direction:column;align-items:flex-start}.cards{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap bar"><div><b>📈 Omzet</b><div id="tenantLabel" class="muted" style="color:#38bdf8">Memuat...</div></div><nav class="nav"><a id="navAdmin">🏠 Dashboard</a><a id="navOrders">📦 Pesanan</a><a id="navHistory">📋 Riwayat</a><a id="navOmzet" class="active">💰 Omzet</a><a id="navSubscription">🚀 Subscription</a><button id="themeToggle" class="theme" type="button">🌙 Mode Gelap</button></nav></div></header><main class="wrap"><input id="dateFrom" type="date"><input id="dateTo" type="date"><button id="refresh">↻ Refresh</button><div id="error" class="err"></div><section class="cards"><div class="card"><span class="muted">Total Omzet</span><b id="total">Rp 0</b></div><div class="card"><span class="muted">Transaksi Selesai</span><b id="count">0</b></div><div class="card"><span class="muted">Rata-rata</span><b id="average">Rp 0</b></div></section><section class="table"><table><thead><tr><th>Tanggal</th><th>Order</th><th>Customer</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></section></main><script type="module">import{supabase,requireTenantRole,redirectToLogin}from'./auth.js';const root=document.documentElement,themeKey='jfs_admin_theme';function setTheme(t){root.classList.toggle('dark',t==='dark');localStorage.setItem(themeKey,t);document.getElementById('themeToggle').textContent=t==='dark'?'☀️ Mode Terang':'🌙 Mode Gelap'}setTheme(localStorage.getItem(themeKey)||'light');document.getElementById('themeToggle').onclick=()=>setTheme(root.classList.contains('dark')?'light':'dark');const code=new URLSearchParams(location.search).get('id')||'JFS-LAUNDRY-DEMO-001',demo=new Set(['JFS-LAUNDRY-DEMO-001','JFS-DEMO-LAUNDRY','demo-asosiasi']);let tenant,orders=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}),meta=o=>{try{return JSON.parse(o.notes||'{}')}catch{return{}}};function show(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}async function guard(){if(demo.has(code))return true;const r=await requireTenantRole(code,['owner','admin'],{allowDemo:false});if(r.mode==='login'){redirectToLogin(location.href);return false}if(r.mode==='forbidden'){show('Akses ditolak.');return false}return true}async function resolve(){const r=await supabase.rpc('jfs_get_tenant_context_by_code',{p_tenant_code:code});if(r.error)throw r.error;if(!r.data?.length)throw Error('Usaha tidak ditemukan atau akun belum memiliki akses.');tenant=r.data[0];document.getElementById('tenantLabel').textContent=tenant.business_name||'JFS Laundry AI';document.getElementById('navAdmin').href=`admin.html?id=${encodeURIComponent(tenant.tenant_code)}`;document.getElementById('navOrders').href=`orders.html?id=${encodeURIComponent(tenant.tenant_code)}`;document.getElementById('navHistory').href=`history.html?id=${encodeURIComponent(tenant.tenant_code)}`;document.getElementById('navSubscription').href=`subscription.html?id=${encodeURIComponent(tenant.tenant_code)}`}async function load(){try{await resolve();const r=await supabase.rpc('jfs_admin_omzet_orders',{p_tenant_id:tenant.id});if(r.error)throw r.error;orders=r.data||[];render();document.getElementById('error').style.display='none'}catch(e){show(e.message||'Gagal memuat omzet.')}}function render(){const f=document.getElementById('dateFrom').value,t=document.getElementById('dateTo').value;const rows=orders.filter(o=>{const d=new Date(o.created_at);return(!f||d>=new Date(`${f}T00:00:00`))&&(!t||d<=new Date(`${t}T23:59:59`))});const total=rows.reduce((s,o)=>s+Number(o.total_amount||0),0);document.getElementById('total').textContent=idr(total);document.getElementById('count').textContent=rows.length;document.getElementById('average').textContent=idr(rows.length?total/rows.length:0);document.getElementById('rows').innerHTML=rows.length?rows.map(o=>{const m=meta(o);return `<tr><td>${esc(new Date(o.created_at).toLocaleString('id-ID'))}</td><td><b>${esc(o.external_id)}</b></td><td>${esc(m.name||'-')}<div class="muted">${esc(m.phone||'-')}</div></td><td><b>${idr(o.total_amount)}</b></td></tr>`}).join(''):'<tr><td colspan="4" style="padding:30px;text-align:center;color:#94a3b8">Belum ada transaksi selesai.</td></tr>'}document.getElementById('dateFrom').oninput=render;document.getElementById('dateTo').oninput=render;document.getElementById('refresh').onclick=load;if(await guard())await load();setInterval(load,15000);</script></body></html>
