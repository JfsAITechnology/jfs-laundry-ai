<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omzet — JFS Laundry AI</title><script src="supabase-config.js?v=20260916-4"></script><style>:root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--line:#e2e8f0;--dark:#0f172a;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.top{background:var(--dark);color:#fff}.wrap{max-width:1100px;margin:auto;padding:16px 20px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{background:#1e293b;color:#fff;padding:9px 11px;border-radius:8px;text-decoration:none;font-weight:700}.nav .active{background:var(--blue)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 11px}.toolbar button{background:#1e293b;color:#fff;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.table{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.card b{display:block;font-size:22px;margin-top:6px}.table{margin-top:15px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{background:var(--dark);color:#fff;text-align:left;padding:10px;font-size:12px}td{padding:10px;border-top:1px solid var(--line);font-size:13px}.muted{font-size:11px;color:var(--muted)}.err{display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:12px;border-radius:10px;margin-top:12px}@media(max-width:700px){.bar{flex-direction:column;align-items:flex-start}.cards{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap bar"><div><b>📈 Omzet</b><div id="tenantLabel" class="muted" style="color:#38bdf8">Memuat...</div></div><nav class="nav"><a id="navAdmin">🏠 Dashboard</a><a id="navOrders">📦 Pesanan</a><a id="navHistory">📋 Riwayat</a><a id="navOmzet" class="active">💰 Omzet</a><a id="navSubscription">🚀 Subscription</a></nav></div></header><main class="wrap"><div class="toolbar"><input id="dateFrom" type="date"><input id="dateTo" type="date"><button id="refresh">↻ Refresh</button></div><div id="error" class="err"></div><section class="cards"><div class="card"><span class="muted">Total Omzet Dibayar</span><b id="total">Rp 0</b></div><div class="card"><span class="muted">Transaksi Lunas</span><b id="count">0</b></div><div class="card"><span class="muted">Rata-rata Transaksi</span><b id="average">Rp 0</b></div></section><section class="table"><table><thead><tr><th>Tanggal</th><th>Order</th><th>Customer</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></section></main><script type="module">import{supabase,requireTenantRole,redirectToLogin}from'./auth.js';const code=new URLSearchParams(location.search).get('id')||'JFS-LAUNDRY-DEMO-001',demo=new Set(['JFS-LAUNDRY-DEMO-001','JFS-DEMO-LAUNDRY','demo-asosiasi']);let tenant,orders=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),idr=n=>Number(n||0).toLocaleString('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}),meta=o=>{try{return JSON.parse(o.notes||'{}')}catch{return{}}};function show(m){$('error').textContent=m;$('error').style.display='block'}async function guard(){if(demo.has(code))return true;const r=await requireTenantRole(code,['owner','admin'],{allowDemo:false});if(r.mode==='login'){redirectToLogin(location.href);return false}if(r.mode==='forbidden'){show('Akses ditolak.');return false}return true}async function resolve(){const r=await supabase.rpc('jfs_get_tenant_context_by_code',{p_tenant_code:code});if(r.error)throw r.error;if(!r.data?.length)throw Error('Usaha tidak ditemukan atau akun belum memiliki akses.');tenant=r.data[0];$('tenantLabel').textContent=tenant.business_name||'JFS Laundry AI';for(const[id,file]of [['navAdmin','admin.html'],['navOrders','orders.html'],['navHistory','history.html'],['navOmzet','omzet.html'],['navSubscription','subscription.html']])$(id).href=`${file}?id=${encodeURIComponent(tenant.tenant_code)}`}async function load(){try{await resolve();const r=await supabase.rpc('jfs_admin_omzet_orders',{p_tenant_id:tenant.id});if(r.error)throw r.error;orders=r.data||[];render();$('error').style.display='none'}catch(e){show(e.message||'Gagal memuat omzet.')}}function render(){const f=$('dateFrom').value,t=$('dateTo').value;const rows=orders.filter(o=>{const d=new Date(o.created_at);return(!f||d>=new Date(f+'T00:00:00'))&&(!t||d<=new Date(t+'T23:59:59'))});const total=rows.reduce((s,o)=>s+Number(o.total_amount||0),0);$('total').textContent=idr(total);$('count').textContent=rows.length;$('average').textContent=idr(rows.length?total/rows.length:0);$('rows').innerHTML=rows.length?rows.map(o=>{const m=meta(o);return `<tr><td>${esc(new Date(o.created_at).toLocaleString('id-ID'))}</td><td><b>${esc(o.external_id)}</b></td><td>${esc(m.name||'-')}<div class="muted">${esc(m.phone||'-')}</div></td><td><b>${idr(o.total_amount)}</b></td></tr>`}).join(''):'<tr><td colspan="4" style="padding:30px;text-align:center;color:#94a3b8">Belum ada transaksi lunas.</td></tr>'}$('dateFrom').oninput=render;$('dateTo').oninput=render;$('refresh').onclick=load;if(await guard())await load();setInterval(load,15000);</script></body></html>
